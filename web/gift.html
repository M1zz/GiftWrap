<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<!--
  The gift rides in the query string, which means it is also in this page's own URL.
  Without this, that URL would be handed to Apple and to the icon's CDN as a Referer
  on the way out — so the payload would leak past the host that already has it.
-->
<meta name="referrer" content="no-referrer">
<!--
  Korean in the markup, both languages in the script.

  The page speaks whichever language the sender chose (`lg` in the payload), falling
  back to the recipient's browser. The static copy below is only what shows if the
  script never runs at all; the script rewrites every line of it before first paint,
  and sets `<html lang>` to match.
-->
<title>선물이 도착했어요</title>
<style>
  /*
   * One page, many gifts. Everything it shows arrives in the URL, so the file is
   * static and can sit on any host.
   *
   * It used to arrive in the fragment, which never reaches the server — the redeem
   * code and the recipient's name stayed out of the host's logs. Messengers broke
   * that: some linkify only up to the '#', and the fragment IS the gift, so the
   * recipient would tap a link that had lost everything in it. A gift that doesn't
   * arrive beats a gift that arrives privately, so the payload moved to `?d=` and
   * the host can see it. Fragments are still read, for links already sent.
   */
  :root {
    --g1: #3D5AFE; --g2: #7A5BFF; --g3: #2ED8C3;   /* gradient stops, overwritten by the payload */
    --b1: #8AF0FF; --b2: #B08CFF;                  /* soft blooms */
    --ink: #fff;
    --ease: cubic-bezier(.22, 1, .36, 1);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: flex; align-items: center; justify-content: center;
    padding: 24px 20px calc(24px + env(safe-area-inset-bottom));
    background: #0e0e12;
    color: var(--ink);
    font: 16px/1.6 -apple-system, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  /* The room the gift sits in — a wash of the card's own colours. */
  body::before {
    content: ""; position: fixed; inset: -20%;
    background:
      radial-gradient(45% 45% at 22% 18%, color-mix(in srgb, var(--b1) 45%, transparent), transparent 70%),
      radial-gradient(50% 50% at 80% 82%, color-mix(in srgb, var(--b2) 40%, transparent), transparent 70%);
    filter: blur(40px); opacity: .5; z-index: 0; pointer-events: none;
  }
  /* A flex item defaults to min-width:auto, which lets the card's intrinsic width
     push it past the screen. Pin it to 0 so max-width actually wins. */
  .stage {
    position: relative; z-index: 1;
    width: 100%; max-width: 420px; min-width: 0;
    text-align: center;
  }
  /* .card sets its own display, which would beat the UA rule for [hidden]. */
  [hidden] { display: none !important; }

  /*
   * The language switch. Deliberately the quietest thing on the page — the sender
   * already chose, and this is only here for when they chose wrong. Fixed rather than
   * in the flow so it never pushes the gift off centre.
   */
  .lang {
    position: fixed; top: 0; right: 0; z-index: 5;
    display: flex; gap: 2px;
    padding: calc(10px + env(safe-area-inset-top)) 12px 10px;
  }
  .lang button {
    padding: 5px 9px; border: 0; border-radius: 999px; cursor: pointer;
    background: none; color: #fff; font: inherit; font-size: 12px;
    opacity: .38; -webkit-tap-highlight-color: transparent;
  }
  .lang button:hover { opacity: .7; }
  .lang button[aria-pressed=true] {
    opacity: .9; font-weight: 600; background: rgba(255,255,255,.16);
  }

  /* ---------- closed ---------- */
  .lead { font-size: 17px; opacity: .85; margin: 0 0 4px; }
  .lead b { font-weight: 700; }
  .sub { font-size: 14px; opacity: .55; margin: 0 0 28px; }

  .box {
    position: relative; width: min(240px, 62vw); aspect-ratio: 1;
    margin: 0 auto; border: 0; padding: 0; cursor: pointer;
    background: none; -webkit-tap-highlight-color: transparent;
    transform-style: preserve-3d;
  }
  .box:focus-visible { outline: 3px solid #fff6; outline-offset: 10px; border-radius: 28px; }

  .tile {
    position: absolute; inset: 0; border-radius: 22%;
    background: linear-gradient(38deg, var(--g1), var(--g2) 52%, var(--g3));
    box-shadow: 0 26px 60px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.25);
    overflow: hidden;
  }
  .tile::after {   /* the same laminate sweep the printed card gets */
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(104deg, transparent 28%, rgba(255,255,255,.18) 45%, transparent 60%);
  }
  /* Ribbon, drawn as two bands so each half can leave on its own. */
  .band { position: absolute; background: rgba(255,255,255,.95); }
  .band.v { left: 50%; top: 0; width: 15.5%; height: 100%; transform: translateX(-50%); }
  .band.h { top: 45.5%; left: 0; height: 15.5%; width: 100%; transform: translateY(-50%); }
  /* The bow. Loops are drawn as rings — you see the wrapping through them, which is
     what makes it read as a bow instead of two dots. */
  .knot {
    position: absolute; left: 50%; top: 45.5%; width: 52%; aspect-ratio: 1;
    transform: translate(-50%, -50%);
  }
  .knot i {
    position: absolute; top: 20%; width: 44%; height: 44%;
    /* em is the box's own size, so the ribbon keeps its proportions at any width.
       The loop is ~23% of the tile, so the stroke has to stay well under that or it
       closes the ring up. */
    border: .032em solid #fff; font-size: inherit;
    border-radius: 62% 38% 46% 54% / 58% 58% 42% 42%;
    box-shadow: 0 2px 6px rgba(0,0,0,.14);
    /* The loop sits on the white cross band, so an open ring would read as solid
       white. Filling it with the wrapping's mid colour — what the tile actually is
       at this point — puts the paper back inside the loop. */
    background: var(--g2);
  }
  .knot i:first-child { left: 2%;  transform: rotate(-20deg); }
  .knot i:last-child  { right: 2%; transform: rotate(20deg) scaleX(-1); }
  .knot b {
    position: absolute; left: 50%; top: 42%; width: 20%; height: 16%;
    background: #fff; border-radius: 40%; transform: translate(-50%, -50%);
    box-shadow: 0 2px 6px rgba(0,0,0,.16);
  }

  .open {
    display: block; margin: 26px auto 0; padding: 13px 26px;
    border: 0; border-radius: 999px; cursor: pointer;
    background: #fff; color: #16161a; font: inherit; font-weight: 700;
    box-shadow: 0 10px 26px rgba(0,0,0,.32);
  }
  .skip {
    display: inline-block; margin-top: 14px; padding: 6px;
    background: none; border: 0; cursor: pointer;
    color: #fff; opacity: .45; font: inherit; font-size: 13px;
    text-decoration: underline; text-underline-offset: 3px;
  }
  .skip:hover { opacity: .75; }

  /* ---------- opening ---------- */
  .is-opening .band.v { animation: slip-v .55s var(--ease) forwards; }
  .is-opening .band.h { animation: slip-h .55s var(--ease) forwards; }
  .is-opening .knot   { animation: pop .45s var(--ease) forwards; }
  .is-opening .tile   { animation: burst .75s .3s var(--ease) forwards; }
  .is-opening .open, .is-opening .skip, .is-opening .lead, .is-opening .sub {
    animation: fade-out .3s ease forwards;
  }
  @keyframes slip-v { to { transform: translateX(-50%) translateY(-130%); opacity: 0; } }
  @keyframes slip-h { to { transform: translateY(-50%) translateX(115%); opacity: 0; } }
  @keyframes pop    { 40% { transform: translate(-50%,-50%) scale(1.25); }
                      to  { transform: translate(-50%,-90%) scale(.6); opacity: 0; } }
  @keyframes burst  { 45% { transform: scale(1.06); }
                      to  { transform: scale(1.9); opacity: 0; } }
  @keyframes fade-out { to { opacity: 0; } }

  /* ---------- revealed ---------- */
  .reveal { display: none; }
  .is-open .closed { display: none; }
  .is-open .reveal { display: block; animation: rise .6s .1s var(--ease) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(26px) scale(.94); } }

  /*
   * The card the composer drew: a 1000 × 630 canvas whose pieces sit at fractions
   * handed over in the payload. Sizes are in cqw — 1cqw is 1% of the card's width,
   * so 10 card units = 1cqw and the arrangement survives at any screen size.
   *
   * --t is the type scale (GiftCardView.typeScale × the block's own size) and --s
   * the frame scale for artwork. Same split as the app: artwork scales its box,
   * text scales its font.
   */
  .card {
    position: relative; overflow: hidden; text-align: left;
    width: 100%; aspect-ratio: 1000 / 630;
    container-type: inline-size;
    /* Squarer than the app's card on purpose — a harder corner reads as a card you
       were handed rather than a button. The app rounds at 56 of 1000 with SwiftUI's
       continuous curve, which hugs the corner far less than a plain circular arc of
       the same radius; 4.2cqw was the arc that matched it. This is deliberately
       under that. */
    border-radius: 2.2cqw;
    background: linear-gradient(38deg, var(--g1), var(--g2) 52%, var(--g3));
    box-shadow: 0 24px 54px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.25);
  }
  .card::after {
    content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 3;
    background: linear-gradient(104deg, transparent 30%, rgba(255,255,255,.14) 46%, transparent 62%);
  }
  /* A rendered card image, when one was supplied, stands in for the whole drawing. */
  .card.shot { background: none; }
  .card.shot img { display: block; width: 100%; height: 100%; object-fit: cover; }

  /*
   * ---------- the five designs ----------
   *
   * Mirrors CardStyle.swift: the block positions arrive from STYLE_LAYOUTS below, and
   * what a style does to the card itself lives here. `st` in the payload picks one; a
   * link made before styles existed has no `st` and gets Classic, which is what those
   * cards were composed in.
   */

  /* Ticket — a stub torn off down the right. The notches are masked out rather than
     painted over, so the page's own backdrop shows through them the way a real bite
     out of the card would. */
  /*
   * The notches are ellipses sized in percentages, not `circle … cqw`.
   *
   * An element can't query the container it establishes itself, and `.card` is the
   * container — so `cqw` here falls back to the viewport and the notch comes out about
   * four times too big on a phone-width card. Percentage radii resolve against the
   * element's own box, and 2.2% × 3.492% of a 1000 × 630 card is the circle of radius
   * 22 that CardStyle cuts.
   */
  .card.s-ticket {
    border-radius: 1.4cqw;
    -webkit-mask-image:
      radial-gradient(ellipse 2.2% 3.492% at 70% 0, transparent 99%, #000 100%),
      radial-gradient(ellipse 2.2% 3.492% at 70% 100%, transparent 99%, #000 100%);
    mask-image:
      radial-gradient(ellipse 2.2% 3.492% at 70% 0, transparent 99%, #000 100%),
      radial-gradient(ellipse 2.2% 3.492% at 70% 100%, transparent 99%, #000 100%);
    -webkit-mask-composite: source-in;
    mask-composite: intersect;
  }
  .card.s-ticket::before {
    content: ""; position: absolute; z-index: 1; pointer-events: none;
    left: 70%; top: 4.1cqw; bottom: 4.1cqw; width: 0;
    border-left: 0.25cqw dashed rgba(255,255,255,.5);
  }
  .card.s-ticket::after {
    background: linear-gradient(104deg, transparent 30%, rgba(255,255,255,.09) 46%, transparent 62%);
  }

  /* Poster — the headline is the card. 1.5cqw × 5.0, matching CardStyle.headlineScale. */
  .card.s-poster .b-occasion {
    font-size: calc(7.5cqw * var(--t));
    letter-spacing: .135cqw;
    line-height: 1.02;
    max-width: 76cqw;
  }
  .card.s-poster::after {
    background: linear-gradient(104deg, transparent 30%, rgba(255,255,255,.16) 46%, transparent 62%);
  }

  /* Centred — the two blocks that take a width become full columns, placed at
     (100 − width) / 2, so centring the text inside them centres it on the card.
     Without the width they would hug their text and sit wherever their left edge
     was put, which is not the middle. */
  .card.s-centered .b-occasion,
  .card.s-centered .b-title,
  .card.s-centered .b-message { text-align: center; }
  .card.s-centered .b-title { width: 64cqw; }
  .card.s-centered .b-message { width: 70cqw; max-width: none; }

  /* Ticket — the text has to stop short of the perforation at 70%. */
  .card.s-ticket .b-title { max-width: 43cqw; }
  .card.s-ticket .b-message { max-width: 60cqw; }

  /* Minimal — no sheen, softer blooms, a hairline frame, and smaller type (the scale
     itself is applied in JS, alongside the app's). */
  .card.s-minimal { border-radius: 1.9cqw; }
  .card.s-minimal::after { background: none; }
  .card.s-minimal::before {
    content: ""; position: absolute; z-index: 1; pointer-events: none;
    inset: 3cqw; border-radius: 1.1cqw;
    border: 0.16cqw solid rgba(255,255,255,.32);
  }

  .blk { position: absolute; z-index: 2; --t: 1.18; --s: 1; }
  .blk > * { overflow-wrap: anywhere; }

  .b-occasion {
    font-size: calc(1.5cqw * var(--t)); font-weight: 700;
    letter-spacing: .45cqw; text-transform: uppercase; opacity: .85;
  }
  .b-badge {
    font-size: calc(1.4cqw * var(--t)); font-weight: 600; opacity: .82;
    padding: .8cqw 1.6cqw; white-space: nowrap;
    border: .12cqw solid rgba(255,255,255,.45); border-radius: 999px;
  }
  .b-logo {
    width: calc(15.2cqw * var(--s)); height: calc(15.2cqw * var(--s));
    border-radius: calc(3.4cqw * var(--s));
    background: rgba(255,255,255,.22); object-fit: cover;
    box-shadow: 0 1.4cqw 2.6cqw rgba(0,0,0,.28);
    display: grid; place-items: center;
    font-size: calc(6.4cqw * var(--t)); font-weight: 800;
  }
  .b-title .name {
    font-size: calc(4.4cqw * var(--t)); font-weight: 700;
    letter-spacing: -.02em; line-height: 1.15;
  }
  .b-title .dev {
    margin-top: .8cqw; font-size: calc(2cqw * var(--t)); font-weight: 500; opacity: .78;
  }
  .b-message {
    font-size: calc(2.5cqw * var(--t)); line-height: 1.45; opacity: .95;
    white-space: pre-wrap; max-width: calc(70cqw * var(--t) / 1.18);
  }
  .b-people .to { font-size: calc(1.9cqw * var(--t)); font-weight: 600; opacity: .9; }
  .b-people .from {
    margin-top: .6cqw; font-size: calc(1.7cqw * var(--t)); font-weight: 500; opacity: .78;
  }
  .b-people .till {
    margin-top: 1cqw; font-size: calc(1.4cqw * var(--t)); font-weight: 500; opacity: .65;
  }
  .b-code {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: calc(1.8cqw * var(--t)); font-weight: 500;
    letter-spacing: .2cqw; white-space: nowrap;
    padding: 1.3cqw 2cqw;
    border: .14cqw dashed rgba(255,255,255,.6); border-radius: 1.6cqw;
  }
  .b-qr {
    padding: calc(.9cqw * var(--s)); background: #fff;
    border-radius: calc(1.6cqw * var(--s)); line-height: 0;
  }
  .b-qr svg {
    display: block; width: calc(10.4cqw * var(--s)); height: calc(10.4cqw * var(--s));
  }

  .fine { margin: 14px 0 0; font-size: 12px; opacity: .6; line-height: 1.5; }

  .cta {
    display: block; margin: 18px 0 0; padding: 16px;
    border-radius: 16px; border: 0; cursor: pointer;
    background: #fff; color: #16161a; font: inherit; font-weight: 700; font-size: 17px;
    text-align: center; text-decoration: none;
    box-shadow: 0 12px 28px rgba(0,0,0,.3);
  }
  .howto { margin-top: 14px; text-align: left; font-size: 13px; opacity: .7; }
  .howto summary { cursor: pointer; opacity: .8; }
  .code {
    display: inline-block; margin-top: 10px; padding: 9px 12px;
    border-radius: 10px; border: 1px dashed rgba(255,255,255,.5);
    font-family: ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: .08em;
    user-select: all;
  }
  .copy {
    margin-left: 8px; padding: 8px 12px; border-radius: 10px;
    border: 1px solid rgba(255,255,255,.4); background: none; color: #fff;
    font: inherit; font-size: 13px; cursor: pointer;
  }

  /* ---------- back from the App Store ---------- */
  .back { display: none; margin-top: 18px; padding: 16px; border-radius: 16px;
          background: rgba(255,255,255,.12); text-align: left; }
  .is-back .back { display: block; animation: rise .4s var(--ease) both; }
  .back p { margin: 0 0 12px; font-size: 15px; }
  .back .cta { margin: 0; }

  /* Loud on purpose. Without a payload this page shows a made-up gift, and a quiet
     footnote was easy to miss — the sample's own name and developer got mistaken for
     a real one that had gone wrong. */
  .demo {
    margin: 0 0 20px; padding: 12px 14px;
    border-radius: 12px; text-align: left;
    background: rgba(255, 214, 102, .16);
    border: 1px solid rgba(255, 214, 102, .45);
    font-size: 13px; line-height: 1.5;
  }
  .demo b { display: block; margin-bottom: 2px; }

  @media (prefers-reduced-motion: reduce) {
    .is-opening .band.v, .is-opening .band.h, .is-opening .knot, .is-opening .tile,
    .is-opening .open, .is-opening .skip, .is-opening .lead, .is-opening .sub,
    .is-open .reveal, .is-back .back { animation: none; }
  }
</style>
</head>
<body>
<div class="lang" id="lang">
  <button type="button" data-lang="ko" aria-pressed="true">한국어</button>
  <button type="button" data-lang="en" aria-pressed="false">English</button>
</div>

<main class="stage" id="stage">

  <div class="demo" id="demo" hidden><b id="demoTitle">샘플 선물입니다</b><span id="demoWhy"></span></div>

  <div class="closed" id="closed">
    <p class="lead" id="lead">선물이 도착했어요</p>
    <p class="sub" id="sub">탭해서 열어 보세요</p>

    <button class="box" id="box" aria-label="선물 열기" style="font-size: min(240px, 62vw)">
      <span class="tile"></span>
      <span class="band v"></span>
      <span class="band h"></span>
      <span class="knot"><i></i><b></b><i></i></span>
    </button>

    <button class="open" id="openBtn" type="button">열어보기</button>
    <div><button class="skip" id="skipBtn" type="button">그냥 바로 받기</button></div>
  </div>

  <div class="reveal" id="reveal">
    <div class="card" id="card"></div>

    <a class="cta" id="cta" href="#">App Store에서 받기</a>

    <details class="howto" id="howto" hidden>
      <summary>버튼이 열리지 않으면</summary>
      <p id="howtoBody">App Store 앱 → 오른쪽 위 프로필 → <b>기프트 카드 또는 코드 사용</b> → 아래 코드를 입력하세요.</p>
      <p><span class="code" id="code"></span><button class="copy" id="copyBtn" type="button">복사</button></p>
    </details>

    <div class="back" id="back">
      <p id="backMsg">받으셨나요? 이제 앱에서 바로 쓸 수 있어요.</p>
      <a class="cta" id="openApp" href="#">앱 열기</a>
    </div>
  </div>

</main>

<script>
/*
 * Minimal QR encoder — byte mode, versions 1–10, no dependencies.
 * Verified against macOS Vision barcode detection: all 500 offer-code URLs
 * round-trip at ECC levels M, Q and H.
 *
 * window.QR = { matrix(text, ecl) -> number[][], path(matrix) -> string }
 */
(function (global) {
  'use strict';

  var EXP = new Uint8Array(512);
  var LOG = new Uint8Array(256);
  (function () {
    var x = 1;
    for (var i = 0; i < 255; i++) {
      EXP[i] = x;
      LOG[x] = i;
      x <<= 1;
      if (x & 0x100) x ^= 0x11d;
    }
    for (var j = 255; j < 512; j++) EXP[j] = EXP[j - 255];
  })();

  function gmul(a, b) {
    return a === 0 || b === 0 ? 0 : EXP[LOG[a] + LOG[b]];
  }

  // version -> level -> [ecCodewordsPerBlock, [[blockCount, dataCodewords], ...]]
  var ECC = {
    1: { L: [7, [[1, 19]]], M: [10, [[1, 16]]], Q: [13, [[1, 13]]], H: [17, [[1, 9]]] },
    2: { L: [10, [[1, 34]]], M: [16, [[1, 28]]], Q: [22, [[1, 22]]], H: [28, [[1, 16]]] },
    3: { L: [15, [[1, 55]]], M: [26, [[1, 44]]], Q: [18, [[2, 17]]], H: [22, [[2, 13]]] },
    4: { L: [20, [[1, 80]]], M: [18, [[2, 32]]], Q: [26, [[2, 24]]], H: [16, [[4, 9]]] },
    5: { L: [26, [[1, 108]]], M: [24, [[2, 43]]], Q: [18, [[2, 15], [2, 16]]], H: [22, [[2, 11], [2, 12]]] },
    6: { L: [18, [[2, 68]]], M: [16, [[4, 27]]], Q: [24, [[4, 19]]], H: [28, [[4, 15]]] },
    7: { L: [20, [[2, 78]]], M: [18, [[4, 31]]], Q: [18, [[2, 14], [4, 15]]], H: [26, [[4, 13], [1, 14]]] },
    8: { L: [24, [[2, 97]]], M: [22, [[2, 38], [2, 39]]], Q: [22, [[4, 18], [2, 19]]], H: [26, [[4, 14], [2, 15]]] },
    9: { L: [30, [[2, 116]]], M: [22, [[3, 36], [2, 37]]], Q: [20, [[4, 16], [4, 17]]], H: [24, [[4, 12], [4, 13]]] },
    10: { L: [18, [[2, 68], [2, 69]]], M: [26, [[4, 43], [1, 44]]], Q: [24, [[6, 19], [2, 20]]], H: [28, [[6, 15], [2, 16]]] }
  };

  var ALIGN = {
    1: [], 2: [6, 18], 3: [6, 22], 4: [6, 26], 5: [6, 30],
    6: [6, 34], 7: [6, 22, 38], 8: [6, 24, 42], 9: [6, 26, 46], 10: [6, 28, 50]
  };

  var VERSION_BITS = { 7: 0x07c94, 8: 0x085bc, 9: 0x09a99, 10: 0x0a4d3 };
  var ECL_BITS = { L: 1, M: 0, Q: 3, H: 2 };

  function dataCodewords(version, ecl) {
    return ECC[version][ecl][1].reduce(function (sum, g) { return sum + g[0] * g[1]; }, 0);
  }

  function capacityBytes(version, ecl) {

    el.dataset.y = l[1];
    if (l.length >= 5) { el.dataset.w = l[3]; el.dataset.h = l[4]; }
    el.style.left = (l[0] * 100).toFixed(3) + '%';
    el.style.top = (l[1] * 100).toFixed(3) + '%';
    var s = l[2] || 1;
    if (ARTWORK[id]) el.style.setProperty('--s', s);
    else el.style.setProperty('--t', (TYPE_SCALE * STYLE_TYPE_SCALE[style] * s).toFixed(4));
    $('card').appendChild(el);
  }

  /**
   * Fit each block into the footprint the composer measured for it, then keep it on
   * the card.
   *
   * The app draws in SF Rounded and SF Mono; the browser has neither, so the same
   * words come out wider here and one block runs into the next — the code chip ends
   * up under the QR. Links made while the composer sent its measurements carry the box
   * each block occupied, and those scale to fit. Everything else is left at its own
   * size and only clamped, with `separate()` below catching the overlap.
   */
  function fitBlocks() {
    var card = $('card');
    var cw = card.clientWidth, ch = card.clientHeight;
    if (!cw || !ch) return;
    var unit = cw / 1000;   // card points → CSS pixels

    [].forEach.call(card.querySelectorAll('.blk'), function (el) {
      var target = parseFloat(el.dataset.w);

      el.style.transform = '';
      var k = 1;
      if (target > 0 && el.offsetWidth > 0) {
        // Only ever shrink: growing a block to fill a wider box would break the
        // type scale the composer chose.
        k = Math.min(1, (target * unit) / el.offsetWidth);
        if (k < 0.999) {
          el.style.transformOrigin = '0 0';
          el.style.transform = 'scale(' + k.toFixed(4) + ')';
        } else {
          k = 1;
        }
      }

      // scale() doesn't change offsetWidth, so the clamp works from the scaled size.
      var w = el.offsetWidth * k;
      var h = el.offsetHeight * k;
      var x = parseFloat(el.dataset.x) * cw;
      var y = parseFloat(el.dataset.y) * ch;
      el.style.left = (Math.min(Math.max(x, 0), Math.max(0, cw - w)) / cw * 100).toFixed(3) + '%';
      el.style.top = (Math.min(Math.max(y, 0), Math.max(0, ch - h)) / ch * 100).toFixed(3) + '%';
      el._k = k;
    });

    separate();
  }

  /**
   * Last resort against one block sitting on top of another.
   *
   * This is the working guard now that measurements don't travel: the wider web text
   * can push the code chip under the QR, and a recipient should never see that. The
   * block on the left gives way, since the one on the right is where the eye is going.
   */
  function separate() {
    var blocks = [].slice.call($('card').querySelectorAll('.blk'));
    blocks.forEach(function (a) {
      var ra = a.getBoundingClientRect();
      blocks.forEach(function (b) {
        if (a === b) return;
        var rb = b.getBoundingClientRect();
        var vertical = ra.top < rb.bottom && rb.top < ra.bottom;
        if (!vertical || ra.left >= rb.left || ra.right <= rb.left) return;

        var room = rb.left - 6 - ra.left;
        if (room <= 0) return;
        var shrink = Math.max(0.4, room / (ra.width || 1));
        a.style.transformOrigin = '0 0';
        a.style.transform = 'scale(' + ((a._k || 1) * shrink).toFixed(4) + ')';
        a._k = (a._k || 1) * shrink;
        ra = a.getBoundingClientRect();
      });
    });
  }

  function qrSVG(value) {
    if (!window.QR) return null;
    var m = window.QR.matrix(value, 'M');
    var ns = 'http://www.w3.org/2000/svg';
    var svg = document.createElementNS(ns, 'svg');
    svg.setAttribute('viewBox', '0 0 ' + m.length + ' ' + m.length);
    svg.setAttribute('shape-rendering', 'crispEdges');
    var path = document.createElementNS(ns, 'path');
    path.setAttribute('d', window.QR.path(m));
    path.setAttribute('fill', '#000');
    svg.appendChild(path);
    return svg;
  }

  function drawCard() {
    var card = $('card');

    // A hosted render, if there is one, is the truest copy of what was designed.
    if (gift.img) {
      card.classList.add('shot');
      var shot = node('img');
      shot.src = gift.img;
      shot.alt = STR[LANG].cardAlt(gift.n || '');
      shot.onerror = function () { card.classList.remove('shot'); card.innerHTML = ''; paintBlocks(); };
      card.appendChild(shot);
      return;
    }
    paintBlocks();
  }

  /** The Apple ID, read back out of whichever link carries it. */
  function appleID() {
    var m = /(?:\/id|[?&]id=)(\d{5,})/.exec((gift.u || '') + ' ' + (gift.p || ''));
    return m ? m[1] : null;
  }

  /**
   * The icon.
   *
   * Normally the link states it (`i`), same as it states the store links, and it draws
   * on the first paint. Older links and any payload that left it out fall back to
   * asking Apple for it by app ID: the monogram goes up first and the icon replaces it
   * when the lookup answers. If it never does — offline, blocked, an app that's been
   * pulled — the monogram is what stays.
   */
  function placeLogo() {
    if (gift.i) {
      var img = node('img');
      img.src = gift.i;
      img.alt = STR[LANG].iconAlt(gift.n || '');
      img.onerror = function () {
        img.remove();
        lookupLogo(node('div', '', (gift.n || '?').trim().charAt(0)));
      };
      place('logo', img);
      return;
    }
    lookupLogo(null);
  }

  /**
   * Bumped every time the card is redrawn, so a lookup still in flight from the
   * previous language can tell that its monogram is no longer on the page and stop.
   */
  var paintGeneration = 0;

  /** Monogram now, real icon if Apple's lookup can name one. */
  function lookupLogo(existing) {
    var mono = existing || node('div', '', (gift.n || '?').trim().charAt(0));
    place('logo', mono);

    var id = appleID();
    if (!id) return;

    var generation = paintGeneration;

    fetch('https://itunes.apple.com/lookup?id=' + id)
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (data) {
        var app = data && data.results && data.results[0];
        var src = app && (app.artworkUrl512 || app.artworkUrl100);
        if (!src || generation !== paintGeneration) return;

        // Swap only once it has actually decoded, so the card never flashes a broken
        // image frame between the monogram and the icon.
        var img = node('img');
        img.alt = STR[LANG].iconAlt(gift.n || '');
        img.onload = function () {
          if (generation !== paintGeneration) return;
          mono.replaceWith(img);
          img.classList.add('blk', 'b-logo');
          img.style.cssText = mono.style.cssText;
          img.dataset.x = mono.dataset.x;
          img.dataset.y = mono.dataset.y;
          fitBlocks();
        };
        img.src = src;
      })
      .catch(function () { /* monogram stays */ });
  }

  function paintBlocks() {
    if (gift.o) place('occasion', node('div', '', gift.o));
    place('badge', node('div', '', STR[LANG].badge));

    placeLogo();

    if (gift.n) {
      var title = node('div');
      title.appendChild(node('div', 'name', gift.n));
      if (gift.d) title.appendChild(node('div', 'dev', gift.d));
      place('title', title);
    }

    if (gift.m) place('message', node('div', '', gift.m));

    if (gift.r || gift.f || gift.e) {
      var people = node('div');
      if (gift.r) people.appendChild(node('div', 'to', STR[LANG].to(gift.r)));
      if (gift.f) people.appendChild(node('div', 'from', STR[LANG].from(gift.f)));
      if (gift.e) {
        var till = untilText(gift.e, LANG);
        if (till) people.appendChild(node('div', 'till', till));
      }
      place('people', people);
    }

    if (gift.k && gift.c) place('code', node('div', '', gift.c));

    if (gift.q && (gift.u || gift.p)) {
      var svg = qrSVG(gift.u || gift.p);
      if (svg) {
        var box = node('div');
        box.appendChild(svg);
        place('qr', box);
      }
    }
  }

  /* ---------- paint ---------- */

  function paintTheme() {
    if (Array.isArray(gift.g) && gift.g.length === 3) {
      document.documentElement.style.setProperty('--g1', '#' + gift.g[0]);
      document.documentElement.style.setProperty('--g2', '#' + gift.g[1]);
      document.documentElement.style.setProperty('--g3', '#' + gift.g[2]);
    }
    if (Array.isArray(gift.b) && gift.b.length === 2) {
      document.documentElement.style.setProperty('--b1', '#' + gift.b[0]);
      document.documentElement.style.setProperty('--b2', '#' + gift.b[1]);
    }
  }

  /**
   * Writes the whole page in one language, and can be run again in the other.
   *
   * Everything the recipient reads goes through here — including the card, which is
   * torn down and redrawn, since the badge, the names and the expiry line are all
   * words. Whether the gift is already unwrapped is left alone: switching language
   * shouldn't re-wrap a gift someone has already opened.
   */
  function applyLanguage(next) {
    LANG = next;
    var S = STR[next];

    document.documentElement.lang = next;
    document.title = S.title;
    gift = sent || demoFor(next);
    paintTheme();

    [].forEach.call($('lang').children, function (button) {
      button.setAttribute('aria-pressed', String(button.dataset.lang === next));
    });

    if (whyKey) {
      $('demoTitle').textContent = S.demoTitle;
      $('demoWhy').textContent = S[whyKey];
      $('demo').hidden = false;
    }

    $('lead').innerHTML = S.lead(gift.r ? esc(gift.r) : '', gift.f ? esc(gift.f) : '');
    $('sub').textContent = S.sub;
    $('box').setAttribute('aria-label', S.boxLabel);
    $('openBtn').textContent = S.open;
    $('skipBtn').textContent = S.skip;
    $('cta').textContent = S.cta;
    $('howto').querySelector('summary').textContent = S.howtoSummary;
    $('howtoBody').innerHTML = S.howtoBody;
    $('copyBtn').textContent = S.copy;
    $('openApp').textContent = S.openApp;
    $('backMsg').textContent = gift.f ? S.backFrom(gift.f) : S.back;

    var redeem = gift.u || gift.p || '';
    $('cta').href = redeem || '#';
    $('openApp').href = gift.p || redeem || '#';

    $('howto').hidden = !gift.c;
    $('code').textContent = gift.c || '';

    // Redraw the card in the new language. Anything the previous paint had in flight
    // is stale from here on.
    paintGeneration++;
    var card = $('card');
    // Rebuild the class list from scratch — the previous paint left its own style on.
    card.className = 'card s-' + styleOf(gift);
    card.innerHTML = '';
    drawCard();
    if (stage.classList.contains('is-open')) fitBlocks();
  }

  applyLanguage(LANG);

  [].forEach.call($('lang').children, function (button) {
    button.addEventListener('click', function () {
      if (button.dataset.lang !== LANG) applyLanguage(button.dataset.lang);
    });
  });

  /* ---------- opening ---------- */

  var opened = false;
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /// The card is hidden until it's unwrapped, and a hidden element measures zero —
  /// so the clamp has to wait for it to be on screen, and run again when the width
  /// changes, since every size on the card is relative to it.
  function reveal() {
    stage.classList.add('is-open');
    fitBlocks();
    if (window.ResizeObserver) {
      new ResizeObserver(fitBlocks).observe($('card'));
    } else {
      window.addEventListener('resize', fitBlocks);
    }
  }

  function open(instant) {
    if (opened) return;
    opened = true;
    if (instant || reduce) {
      reveal();
      return;
    }
    stage.classList.add('is-opening');
    // Long enough for the ribbon to leave and the tile to burst.
    setTimeout(function () {
      stage.classList.remove('is-opening');
      reveal();
    }, 950);
  }

  $('box').addEventListener('click', function () { open(false); });
  $('openBtn').addEventListener('click', function () { open(false); });
  $('skipBtn').addEventListener('click', function () { open(true); });

  /* ---------- coming back from the App Store ---------- */

  var went = false;
  $('cta').addEventListener('click', function () { went = true; });
  document.addEventListener('visibilitychange', function () {
    if (went && document.visibilityState === 'visible') {
      // The wording is already in place from applyLanguage — this only reveals it.
      stage.classList.add('is-back');
    }
  });

  $('copyBtn').addEventListener('click', function () {
    var done = function () { $('copyBtn').textContent = STR[LANG].copied; };
    if (navigator.clipboard) navigator.clipboard.writeText(gift.c).then(done, done);
    else done();
  });
})();
</script>
</body>
</html>
