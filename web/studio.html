<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GiftWrap Studio</title>
<!--
  The macOS app, in a browser.

  Same three tabs, same card, same links. It exists because the app only runs on a Mac
  and only for whoever built it, while a gift link is something you might want to make
  from any machine.

  Two things are deliberately shared with the rest of the repo rather than reinvented:
  the card's geometry (CardStyle.swift — same fractions, same chrome) and the gift-link
  payload (RedeemLinkBuilder.swift — same short keys, same base64url). A card composed
  here and a card composed in the app produce the same drawing and the same URL.

  The card is drawn on a canvas rather than in the DOM, so the preview and the exported
  PNG are one renderer at two scales — the same bargain the app makes with SwiftUI.
-->
<style>
  :root {
    --bg: #f5f5f7;
    --panel: #ffffff;
    --ink: #1d1d1f;
    --ink-2: #6e6e73;
    --line: #d2d2d7;
    --accent: #0071e3;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.6 -apple-system, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  h1 { font-size: 22px; margin: 0; letter-spacing: -0.02em; }
  h2 { font-size: 15.5px; margin: 0 0 12px; letter-spacing: -0.01em; }
  .sub { color: var(--ink-2); font-size: 13px; }

  .wrap { max-width: 1280px; margin: 0 auto; padding: 24px 20px 80px; }
  header.top { display: flex; align-items: baseline; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }

  .panel {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 16px; margin-bottom: 14px;
  }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field > label, .field > .lbl { font-size: 12.5px; color: var(--ink-2); }
  input[type=text], input[type=date], input[type=number], select, textarea {
    font: inherit; padding: 6px 9px;
    border: 1px solid var(--line); border-radius: 8px; background: #fff; color: inherit;
  }
  textarea { width: 100%; resize: vertical; font-size: 13px; }
  button {
    font: inherit; font-weight: 500; padding: 6px 12px; border-radius: 8px;
    border: 1px solid var(--line); background: #fff; color: var(--ink); cursor: pointer;
  }
  button:hover { background: #f0f0f2; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { filter: brightness(1.08); }
  button:disabled { opacity: .4; cursor: default; }
  button.mini { padding: 4px 9px; font-size: 12.5px; }

  .lang { margin-left: auto; display: flex; gap: 4px; }
  .lang button {
    padding: 4px 10px; font-size: 12.5px; border-radius: 999px;
    color: var(--ink-2); background: none; border: 1px solid transparent;
  }
  .lang button:hover { background: #ebebed; color: var(--ink); }
  .lang button[aria-pressed=true] {
    color: var(--ink); background: #fff; border-color: var(--line); font-weight: 600;
  }

  .tabs { display: flex; gap: 6px; margin: 0 0 14px; border-bottom: 1px solid var(--line); }
  .tabs button {
    border: none; background: none; border-bottom: 2px solid transparent;
    border-radius: 0; padding: 8px 13px; color: var(--ink-2);
  }
  .tabs button:hover { background: none; color: var(--ink); }
  .tabs button[aria-selected=true] { color: var(--ink); border-bottom-color: var(--ink); font-weight: 600; }

  /* Two columns: the form, then the card. Same split as the app's HSplitView. */
  .studio { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
  .form { flex: 0 1 430px; min-width: 340px; }
  .stage { flex: 1 1 560px; min-width: 420px; position: sticky; top: 16px; }

  /* align-self, because .field is a flex column and its children stretch by default —
     which would pull a three-item segmented control across the whole panel. */
  .seg {
    display: inline-flex; align-self: flex-start;
    border: 1px solid var(--line); border-radius: 8px; overflow: hidden;
  }
  .seg button {
    border: none; border-radius: 0; border-right: 1px solid var(--line);
    padding: 5px 11px; font-size: 13px; background: #fff;
  }
  .seg button:last-child { border-right: none; }
  .seg button[aria-pressed=true] { background: var(--accent); color: #fff; font-weight: 600; }

  /* Design picker — schematics, not miniature renders. Five real cards at a centimetre
     wide would each build a QR to be squinted at; bars where the blocks go carry the
     one thing being chosen. */
  .styles { display: flex; gap: 7px; flex-wrap: wrap; }
  .styles .pick { border: none; background: none; padding: 0; cursor: pointer; }
  /* display:block — a span is inline, and an inline box ignores width and height,
     which collapses the whole thumbnail to a hairline. */
  .styles .thumb {
    display: block;
    width: 78px; height: 49px; border-radius: 6px; position: relative; overflow: hidden;
    border: 1px solid rgba(0,0,0,.15);
  }
  .styles .pick[aria-pressed=true] .thumb { border: 2.5px solid var(--accent); }
  .styles .name { display: block; font-size: 10.5px; color: var(--ink-2); margin-top: 2px; text-align: center; }
  .styles .pick[aria-pressed=true] .name { color: var(--accent); font-weight: 600; }
  .styles .mark { display: block; position: absolute; background: rgba(255,255,255,.5); }
  .styles .mark.strong { background: rgba(255,255,255,.95); }
  .styles .perf { position: absolute; width: 1px; background: rgba(255,255,255,.55); }

  .swatches { display: flex; gap: 10px; }
  .swatches button {
    width: 28px; height: 28px; border-radius: 999px; padding: 0; border: none; cursor: pointer;
  }
  .swatches button[aria-pressed=true] { box-shadow: 0 0 0 2.5px var(--accent); }

  /* Both preview canvases scale to their column — they carry a fixed pixel size for
     drawing, which without this would lay out at its full width and overflow. */
  .stage canvas { width: 100%; height: auto; display: block; }
  canvas#card { touch-action: none; outline: none; }
  canvas#card:focus-visible { box-shadow: 0 0 0 3px rgba(0,113,227,.4); border-radius: 10px; }

  .editorbar {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    padding: 7px 10px; background: #ececee; border-radius: 8px; margin-top: 6px;
  }
  .linkline {
    display: flex; gap: 8px; align-items: center; margin-top: 10px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11px; color: var(--ink-2);
  }
  .linkline span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .copybox {
    margin-top: 10px; padding: 11px; border-radius: 11px;
    background: rgba(0,113,227,.06); border: 1px solid rgba(0,113,227,.22);
  }
  .copybox .head { font-size: 11.5px; font-weight: 600; color: var(--ink-2); margin-bottom: 7px; }
  .copybox .pair { display: flex; gap: 9px; flex-wrap: wrap; }
  .copybox .pair button { flex: 1 1 200px; text-align: left; padding: 8px 11px; line-height: 1.3; }
  .copybox .pair button b { display: block; font-size: 12px; font-weight: 600; }
  .copybox .pair button small { font-size: 10px; opacity: .75; }

  .actions { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 10px; }
  .status { font-size: 12.5px; color: var(--ink-2); margin-top: 8px; min-height: 1.2em; }

  .warn { color: #a15c00; }

  .drop {
    border: 2px dashed var(--line); border-radius: var(--radius);
    padding: 20px; text-align: center; color: var(--ink-2); cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .drop.over { border-color: var(--accent); background: #f0f7ff; }
  .drop strong { color: var(--ink); font-size: 14px; }
  .note {
    background: #fff8e6; border: 1px solid #f0dca8; border-radius: 10px;
    padding: 11px 13px; font-size: 13.5px; line-height: 1.55; margin-bottom: 14px;
  }

  table.ledger { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  table.ledger th, table.ledger td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  table.ledger th { color: var(--ink-2); font-weight: 500; }
  table.ledger td.code { font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  table.ledger tr.done { background: #f2fbf5; }

  @media (max-width: 900px) {
    .stage { position: static; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <h1>GiftWrap Studio</h1>
    <span class="sub" data-i18n="tagline">App Store 선물 카드와 링크를 브라우저에서 만듭니다</span>
    <div class="lang" id="uiLang">
      <button type="button" data-lang="ko" aria-pressed="true">한국어</button>
      <button type="button" data-lang="en" aria-pressed="false">English</button>
    </div>
  </header>

  <div class="tabs" role="tablist">
    <button role="tab" data-tab="compose" aria-selected="true" data-i18n="tabCompose">카드 만들기</button>
    <button role="tab" data-tab="batch" aria-selected="false" data-i18n="tabBatch">여러 장 만들기</button>
    <button role="tab" data-tab="ledger" aria-selected="false" data-i18n="tabLedger">보낸 기록</button>
  </div>

  <!-- ============ Compose ============ -->
  <section id="tab-compose">
    <div class="studio">
      <div class="form">

        <section class="panel">
          <h2 data-i18n="appSection">앱</h2>
          <div class="row">
            <div class="field" style="flex:1; min-width:190px">
              <label for="query" data-i18n="appQueryField">App Store 링크 또는 ID</label>
              <input type="text" id="query" data-i18n-ph="appQueryPlaceholder"
                     placeholder="6759643878 또는 https://apps.apple.com/…">
            </div>
            <button id="lookupBtn" data-i18n="lookUp">불러오기</button>
            <div class="field">
              <label for="storefront" data-i18n="storefront">스토어프론트</label>
              <select id="storefront">
                <option value="kr" data-i18n="storeKR">한국 (kr)</option>
                <option value="us" data-i18n="storeUS">미국 (us)</option>
                <option value="jp" data-i18n="storeJP">일본 (jp)</option>
                <option value="gb" data-i18n="storeGB">영국 (gb)</option>
              </select>
            </div>
          </div>
          <div class="sub" id="appStatus" style="margin-top:8px"></div>
        </section>

        <section class="panel">
          <h2 data-i18n="deliverySection">전달 방식</h2>
          <div class="seg" id="kindSeg">
            <button type="button" data-kind="directLink" aria-pressed="true" data-i18n="kindDirectLink">다운로드 링크</button>
            <button type="button" data-kind="appPromoCode" aria-pressed="false" data-i18n="kindAppPromoCode">앱 프로모션 코드</button>
            <button type="button" data-kind="offerCode" aria-pressed="false" data-i18n="kindOfferCode">인앱 오퍼 코드</button>
          </div>
          <div class="sub" id="kindWhy" style="margin-top:7px"></div>
          <div class="sub" id="autoFill" style="margin-top:5px"></div>

          <div id="codeArea" style="margin-top:11px" hidden>
            <div class="field">
              <label for="code" data-i18n="codeField">코드</label>
              <input type="text" id="code" style="font-family:ui-monospace,Menlo,monospace">
            </div>
            <div class="sub warn" id="codeUsed" style="margin-top:5px" hidden></div>
            <label style="display:block; margin-top:9px; font-size:13px">
              <input type="checkbox" id="hasExpiry"> <span data-i18n="showExpiry">만료일 표시</span>
            </label>
            <div class="field" id="expiryField" style="margin-top:6px" hidden>
              <label for="expiry" data-i18n="expiryField">만료일</label>
              <input type="date" id="expiry" style="width:170px">
            </div>
          </div>
        </section>

        <section class="panel">
          <h2 data-i18n="cardSection">카드</h2>

          <div class="field">
            <span class="lbl" data-i18n="cardStyle">디자인</span>
            <div class="styles" id="stylePicker"></div>
            <span class="sub" data-i18n="cardStyleHint" style="font-size:11.5px">스타일마다 배치를 따로 기억합니다.</span>
          </div>

          <div class="field" style="margin-top:11px">
            <span class="lbl" data-i18n="cardLanguage">카드 언어</span>
            <div class="seg" id="cardLangSeg">
              <button type="button" data-lang="ko" aria-pressed="true">한국어</button>
              <button type="button" data-lang="en" aria-pressed="false">English</button>
            </div>
            <span class="sub" data-i18n="cardLanguageHint" style="font-size:11.5px">받는 사람이 보는 언어입니다.</span>
          </div>

          <div class="row" style="margin-top:11px">
            <div class="field" style="flex:1; min-width:150px">
              <label for="occasion" data-i18n="occasionField">문구</label>
              <input type="text" id="occasion" maxlength="24">
            </div>
            <div class="field" style="width:110px">
              <label for="recipient" data-i18n="recipient">받는 사람</label>
              <input type="text" id="recipient">
            </div>
            <div class="field" style="width:110px">
              <label for="sender" data-i18n="sender">보내는 사람</label>
              <input type="text" id="sender">
            </div>
          </div>

          <div class="field" style="margin-top:9px">
            <label for="message" data-i18n="message">메시지</label>
            <textarea id="message" rows="3"></textarea>
            <span class="sub" data-i18n="messageLimit" style="font-size:11.5px">세 줄까지 카드에 들어갑니다.</span>
          </div>

          <div class="field" style="margin-top:11px">
            <span class="lbl" data-i18n="colour">색상</span>
            <div class="swatches" id="themePicker"></div>
          </div>

          <div style="margin-top:11px; font-size:13px">
            <label style="display:block"><input type="checkbox" id="showCode" checked> <span data-i18n="showCode">카드에 코드 표시</span></label>
            <label style="display:block; margin-top:4px"><input type="checkbox" id="showQR" checked> <span data-i18n="showQR">QR 코드 넣기</span></label>
          </div>
        </section>

        <section class="panel">
          <details>
            <summary class="sub" style="cursor:pointer" data-i18n="campaignGroup">캠페인 추적 (선택)</summary>
            <div class="row" style="margin-top:9px">
              <div class="field"><label for="pt">Provider token (pt)</label><input type="text" id="pt" style="width:160px"></div>
              <div class="field"><label for="ct">Campaign code (ct)</label><input type="text" id="ct" style="width:160px"></div>
            </div>
            <div class="sub" data-i18n="campaignHint" style="margin-top:6px; font-size:11.5px"></div>
          </details>
        </section>
      </div>

      <div class="stage">
        <canvas id="card" width="1240" height="880" tabindex="0" data-i18n-aria="canvasLabel"
                aria-label="카드 미리보기 — 요소를 끌어서 배치할 수 있습니다"></canvas>

        <div class="editorbar">
          <span class="sub" id="editorHint"></span>
          <button class="mini" id="resetLayout" style="margin-left:auto" data-i18n="resetLayout">배치 초기화</button>
        </div>

        <div class="linkline" id="linkLine" hidden>
          <span id="redeemLink"></span>
          <button class="mini" id="openRedeem" data-i18n="open">열기</button>
        </div>

        <div class="copybox">
          <div class="head" data-i18n="copyLinkHeading">링크 복사</div>
          <div class="pair">
            <button class="primary" id="copyGift">
              <b data-i18n="copyGiftLink">선물 페이지 링크 복사</b>
              <small data-i18n="copyGiftLinkSub">카드가 먼저 열리는 선물 페이지</small>
            </button>
            <button id="copyRedeem">
              <b data-i18n="copyRedeemLink">프로모션 링크만 복사</b>
              <small data-i18n="copyRedeemLinkSub">App Store로 바로 가는 원본 링크</small>
            </button>
          </div>
        </div>

        <div class="actions">
          <button id="copyMessage" data-i18n="copyMessage">문구 복사</button>
          <button id="copyImage" data-i18n="copyImage">이미지 복사</button>
          <button id="savePNG" data-i18n="savePNG">PNG 저장</button>
          <button id="previewGift" data-i18n="previewReceived">받는 화면 미리보기</button>
          <button class="primary" id="addLedger" style="margin-left:auto" data-i18n="addToLedger">보낸 기록에 추가</button>
        </div>
        <div class="status" id="status"></div>
      </div>
    </div>
  </section>

  <!-- ============ Batch ============ -->
  <section id="tab-batch" hidden>
    <div class="note" data-i18n-html="batchNote"></div>
    <div class="studio">
      <div class="form">
        <section class="panel">
          <h2 data-i18n="batchCodeList">코드 목록</h2>

          <div id="csvDrop" class="drop">
            <strong data-i18n="csvDropTitle">CSV 파일을 여기에 끌어다 놓으세요</strong><br>
            <span class="sub" data-i18n="csvDropSub">App Store Connect에서 받은 OfferCodeOneTimeUseCodes…csv · 클릭해서 고를 수도 있습니다</span>
            <input type="file" id="csvFile" accept=".csv,.txt" hidden>
          </div>

          <span class="sub" data-i18n="batchHint" style="display:block; margin-top:11px"></span>
          <textarea id="batchInput" rows="10" style="margin-top:6px; font-family:ui-monospace,Menlo,monospace"></textarea>
          <div class="row" style="margin-top:9px">
            <span class="sub" id="batchCount"></span>
            <button class="primary" id="batchCSV" style="margin-left:auto" data-i18n="batchExportCSV">CSV 내보내기</button>
            <button id="batchPNG" data-i18n="batchExportPNG">PNG 전부 저장</button>
          </div>
          <div class="sub" id="batchStatus" style="margin-top:8px"></div>
        </section>
      </div>
      <div class="stage">
        <canvas id="batchCard" width="1240" height="880"></canvas>
        <div class="sub" data-i18n="batchPreviewNote" style="margin-top:8px"></div>
      </div>
    </div>
  </section>

  <!-- ============ Ledger ============ -->
  <section id="tab-ledger" hidden>
    <section class="panel">
      <div class="row" style="margin-bottom:11px">
        <input type="text" id="ledgerSearch" data-i18n-ph="search" placeholder="검색" style="flex:1; min-width:180px">
        <span class="sub" id="ledgerCount"></span>
        <button class="mini" id="ledgerCSV" data-i18n="exportCSV">CSV 내보내기</button>
        <button class="mini" id="ledgerClear" data-i18n="clearLedger">기록 지우기</button>
      </div>
      <table class="ledger"><thead>
        <tr>
          <th style="width:96px" data-i18n="ledgerDate">보낸 날짜</th>
          <th data-i18n="ledgerApp">앱</th>
          <th style="width:110px" data-i18n="recipient">받는 사람</th>
          <th style="width:140px" data-i18n="codeField">코드</th>
          <th style="width:120px" data-i18n="ledgerKind">방식</th>
          <th style="width:58px" data-i18n="ledgerRedeemed">사용됨</th>
          <th style="width:66px"></th>
        </tr>
      </thead><tbody id="ledgerBody"></tbody></table>
      <div class="sub" id="ledgerEmpty" style="margin-top:14px"></div>
    </section>
  </section>

</div>

<script src="qr.js"></script>
<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };

  // =====================================================================
  //  Words
  // =====================================================================
  /* The interface's language and the card's language are separate choices, exactly as
     in the app: the first is for whoever is composing, the second is picked on the
     recipient's behalf and travels in the link. */

  var UI = {
    ko: {
      tagline: 'App Store 선물 카드와 링크를 브라우저에서 만듭니다',
      tabCompose: '카드 만들기', tabBatch: '여러 장 만들기', tabLedger: '보낸 기록',
      appSection: '앱', appQueryField: 'App Store 링크 또는 ID',
      appQueryPlaceholder: '6759643878 또는 https://apps.apple.com/…',
      lookUp: '불러오기', storefront: '스토어프론트',
      storeKR: '한국 (kr)', storeUS: '미국 (us)', storeJP: '일본 (jp)', storeGB: '영국 (gb)',
      deliverySection: '전달 방식',
      kindDirectLink: '다운로드 링크', kindAppPromoCode: '앱 프로모션 코드', kindOfferCode: '인앱 오퍼 코드',
      kindDirectLinkWhy: '코드 없이 App Store 제품 페이지로 보냅니다. 무료 앱에 적합합니다.',
      kindAppPromoCodeWhy: '유료 앱을 무료로 받는 1회용 코드입니다. 생성 후 4주간 유효합니다.',
      kindOfferCodeWhy: '구독·인앱 결제용 코드입니다. 앱이 무료 다운로드라면 이 방식을 씁니다.',
      codeField: '코드', codeAlreadySent: '이미 보낸 코드입니다.',
      showExpiry: '만료일 표시', expiryField: '만료일',
      cardSection: '카드', cardStyle: '디자인',

  /**
   * Korean particles that change shape with the word in front of them.
   *
   * "메시지과 코드가" is wrong twice over — it should be "메시지와 코드가". Hangul
   * syllables are laid out so the final consonant is (code − 0xAC00) mod 28, and zero
   * means there isn't one. "QR" and anything else non-Hangul is read ending in a
   * consonant, which is also the safer default.
   */
  function endsInConsonant(word) {
    if (!word) return true;
    var code = word.charCodeAt(word.length - 1);
    if (code < 0xAC00 || code > 0xD7A3) return true;
    return (code - 0xAC00) % 28 !== 0;
  }
  function waGwa(w) { return endsInConsonant(w) ? '과' : '와'; }
  function iGa(w) { return endsInConsonant(w) ? '이' : '가'; }
