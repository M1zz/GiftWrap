    cardLang: pref('giftwrap.cardLang', ['ko', 'en'], LANG),
    theme: pref('giftwrap.theme', THEME_IDS, 'sunrise'),
    expiry: '', showCode: true, showQR: true, pt: '', ct: ''
  };

  /** Whether the kind picker was touched, so a later lookup stops second-guessing. */
  var kindChosenManually = false;
  var iconImg = null;
  var layout = loadLayout(draft.style);
  var ledger = loadLedger();

  // ---------- layout, saved per style ----------

  function clamp(v, lo, hi) { return Math.min(hi, Math.max(lo, v)); }
  function normScale(v) { return (isFinite(v) && v > 0) ? clamp(v, SCALE_MIN, SCALE_MAX) : 1; }

  function defaultLayout(style) {
    var out = {};
    BLOCK_IDS.forEach(function (id) {
      var d = STYLES[style].layout[id];
      out[id] = d ? { x: d[0], y: d[1], s: d[2] || 1 } : { x: 0, y: 0, s: 1 };
    });
    return out;
  }
  function loadLayout(style) {
    var out = defaultLayout(style), saved = {};
    try { saved = JSON.parse(localStorage.getItem('giftwrap.layout.' + style) || '{}'); } catch (e) {}
    BLOCK_IDS.forEach(function (id) {
      var p = saved[id];
      if (p && isFinite(p.x) && isFinite(p.y)) {
        out[id] = { x: clamp(p.x, 0, 1), y: clamp(p.y, 0, 1), s: normScale(p.s) };
      }
    });
    return out;
  }
  /**
   * Saves an arrangement, or forgets it when it matches the style's own defaults.
   *
   * Not storing the untouched case matters: switching styles saves the outgoing one,
   * so merely visiting a style would otherwise pin whatever its defaults were that
   * day, and a later correction to the design would never reach anyone who had looked.
   */
  function saveLayout() {
    var key = 'giftwrap.layout.' + draft.style;
    try {
      if (layoutIsDefault()) localStorage.removeItem(key);
      else localStorage.setItem(key, JSON.stringify(layout));
    } catch (e) {}
  }
  function layoutIsDefault() {
    var d = defaultLayout(draft.style);
    return BLOCK_IDS.every(function (id) {
      return Math.abs(layout[id].x - d[id].x) < 1e-6 &&
             Math.abs(layout[id].y - d[id].y) < 1e-6 &&
             Math.abs(layout[id].s - d[id].s) < 1e-6;
    });
  }
  function scaleOf(id) { return normScale(layout[id] && layout[id].s); }

  // ---------- ledger ----------

  function loadLedger() {
    try {
      var v = JSON.parse(localStorage.getItem('giftwrap.ledger') || '[]');
      return Array.isArray(v) ? v : [];
    } catch (e) { return []; }
  }
  function saveLedger() {
    try { localStorage.setItem('giftwrap.ledger', JSON.stringify(ledger)); } catch (e) {}
  }
  function codeAlreadySent(code) {
    var needle = String(code || '').trim().toUpperCase();
    if (!needle) return false;
    return ledger.some(function (r) { return (r.code || '').toUpperCase() === needle; });
  }

  // =====================================================================
  //  Links — mirrors RedeemLinkBuilder.swift
  // =====================================================================

  function trimmedCode() { return draft.code.trim().toUpperCase(); }
  function requiresCode() { return draft.kind !== 'directLink'; }
  function hasExpiry() { return draft.kind !== 'directLink'; }

  function numericID(text) {
    var s = String(text || '').trim();
    if (/^\d+$/.test(s)) return s;
    // The query item wins over the path, so an app slug containing "id123456" can't.
    var q = s.match(/[?&]id=(\d+)/i);
    if (q) return q[1];
    var m = s.match(/\/id(\d{5,})/) || s.match(/\bid=?(\d{5,})/);
    return m ? m[1] : '';
  }

  function parseLink(text) {
    var id = numericID(text);
    if (!id) return null;
    var out = { appleID: id, kind: '', code: '', pt: '', ct: '' };
    var ctx = String(text).match(/[?&]ctx=(offercodes|apps)\b/i);
    if (ctx) out.kind = ctx[1].toLowerCase() === 'apps' ? 'appPromoCode' : 'offerCode';
    var code = String(text).match(/[?&]code=([^&\s]+)/i);
    if (code) out.code = decodeURIComponent(code[1]).toUpperCase();
    var pt = String(text).match(/[?&]pt=([^&\s]+)/i);
    if (pt) out.pt = decodeURIComponent(pt[1]);
    var ct = String(text).match(/[?&]ct=([^&\s]+)/i);
    if (ct) out.ct = decodeURIComponent(ct[1]);
    return out;
  }

  function inferredKind(explicit, isFree, codePresent) {
    if (explicit) return explicit;
    if (!isFree) return 'appPromoCode';
    return codePresent ? 'offerCode' : 'directLink';
  }

  function redeemURL() {
    if (!draft.app) return '';
    var base;
    if (draft.kind === 'directLink') {
      base = draft.app.productURL || ('https://apps.apple.com/app/id' + draft.app.id);
    } else {
      if (!trimmedCode()) return '';
      var ctx = draft.kind === 'appPromoCode' ? 'apps' : 'offercodes';
      base = 'https://apps.apple.com/redeem?ctx=' + ctx +
             '&id=' + draft.app.id + '&code=' + encodeURIComponent(trimmedCode());
    }
    var extra = [];
    if (draft.pt.trim()) extra.push('pt=' + encodeURIComponent(draft.pt.trim()));
    if (draft.ct.trim()) extra.push('ct=' + encodeURIComponent(draft.ct.trim()));
    if (!extra.length) return base;
    return base + (base.indexOf('?') >= 0 ? '&' : '?') + extra.join('&');
  }

  function b64url(text) {
    var bytes = new TextEncoder().encode(text), bin = '';
    for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }

  function giftPayload() {
    var url = redeemURL();
    var p = { v: 1 };
    if (draft.app) {
      p.n = draft.app.name;
      if (draft.app.developer) p.d = draft.app.developer;
      if (draft.app.icon) p.i = draft.app.icon;
      if (draft.app.productURL) p.p = draft.app.productURL;
    }
    if (url) p.u = url;
    if (requiresCode() && trimmedCode()) p.c = trimmedCode();
    p.o = draft.occasion.trim() || cardText().defaultOccasion;
    if (draft.message.trim()) p.m = draft.message.trim();
    if (draft.sender.trim()) p.f = draft.sender.trim();
    if (draft.recipient.trim()) p.r = draft.recipient.trim();
    var th = THEMES[draft.theme];
    p.g = th.stops.map(function (h) { return h.replace('#', ''); });
    p.b = th.blooms.map(function (h) { return h.replace('#', ''); });
    p.q = !!(draft.showQR && url);
    p.k = !!(draft.showCode && requiresCode() && trimmedCode());
    if (draft.expiry && hasExpiry()) p.e = draft.expiry;
    p.lg = draft.cardLang;
    p.st = draft.style;
    return p;
  }

  function giftLink() {
    if (!draft.app) return '';
    return GIFT_PAGE + '?d=' + b64url(JSON.stringify(giftPayload()));
  }

  function isReady() {
    if (!draft.app) return false;
    return requiresCode() ? !!trimmedCode() : true;
  }

  /** The text you paste into a messenger. Mirrors GiftExporter.messageText. */
  function messageText() {
    var W = cardText();
    var lines = [];
    var wrapped = giftLink();
    if (draft.recipient.trim()) lines.push(W.toHonorific(draft.recipient.trim()));
    if (wrapped) {
      lines.push('');
      lines.push(W.giftArrived);
      lines.push(wrapped);
    } else {
      if (draft.message.trim()) lines.push(draft.message.trim());
      if (draft.app) { lines.push(''); lines.push('🎁 ' + draft.app.name); }
      lines.push(redeemURL());
      if (requiresCode() && trimmedCode()) {
        lines.push(W.codeLine(trimmedCode()));
        lines.push(W.manualRedeem);
      }
    }
    if (draft.expiry && hasExpiry()) {
      var p = draft.expiry.split('-');
      if (p.length === 3) lines.push(W.usableUntil(p[0], +p[1], +p[2]));
    }
    if (draft.sender.trim()) { lines.push(''); lines.push('— ' + draft.sender.trim()); }
    return lines.join('\n');
  }

  // =====================================================================
  //  App Store lookup
  // =====================================================================

  function lookup() {
    var raw = $('query').value.trim();
    if (!raw) return;
    var parsed = parseLink(raw);
    if (!parsed) { $('appStatus').textContent = t().lookupBadInput; return; }

    $('appStatus').textContent = t().lookingUp;
    var store = $('storefront').value;

    /*
     * The nonce is not cache-busting for freshness — it's for CORS.
     *
     * Apple's lookup endpoint answers `Access-Control-Allow-Origin` with the Origin
     * that asked, and its CDN caches the response *including that header*, without a
     * `Vary: Origin`. So whoever warms a given URL decides which origin may read it:
     * a request from a localhost copy of this page leaves behind
     * `Access-Control-Allow-Origin: http://127.0.0.1:8931`, and every other site
     * asking for the same URL is then refused by the browser.
     *
     * A per-request token gives each caller its own cache entry, and so its own
     * header. Lookups happen on an explicit press, not per keystroke, so the cache
     * this gives up was never doing much.
     */
    function fetchIn(country) {
      var nonce = Math.random().toString(36).slice(2) + Date.now().toString(36);
      return fetch('https://itunes.apple.com/lookup?id=' + encodeURIComponent(parsed.appleID) +
        (country ? '&country=' + country : '') + '&entity=software&cb=' + nonce)
        .then(function (r) { return r.json(); });
    }

    fetchIn(store)
      .then(function (d) { return d.resultCount ? d : fetchIn(''); })
      .then(function (d) {
        if (!d.resultCount) throw new Error('not found');
        var r = d.results[0];
        draft.app = {
          id: r.trackId,
          name: r.trackName,
          developer: r.artistName,
          icon: (r.artworkUrl512 || r.artworkUrl100 || '').replace(/\/\d+x\d+bb/, '/512x512bb'),
          formattedPrice: r.formattedPrice || '',
          isFree: (r.price === 0 || r.formattedPrice === 'Free' || r.formattedPrice === '무료'),
          productURL: r.trackViewUrl || ''
        };
        applyParsed(parsed);
        $('appStatus').textContent = t().resolved(
          draft.app.name, draft.app.formattedPrice || (draft.app.isFree ? t().free : '')
        );
        loadIcon(draft.app.icon);
        syncForm();
        render();
      })
      .catch(function (err) {
        draft.app = null;
        iconImg = null;
        $('appStatus').textContent =
          String(err && err.message) === 'not found' ? t().lookupNotFound : t().lookupFailed;
        render();
      });
  }

  /** Pours the pasted link into the form, the way ComposerModel.apply does. */
  function applyParsed(parsed) {
    var filled = [];
    if (parsed.code && parsed.code !== trimmedCode()) { draft.code = parsed.code; filled.push(t().codeField); }
    if (parsed.pt && parsed.pt !== draft.pt) { draft.pt = parsed.pt; filled.push('pt'); }
    if (parsed.ct && parsed.ct !== draft.ct) { draft.ct = parsed.ct; filled.push('ct'); }

    // An explicit ctx= is a fresh statement of intent and outranks an earlier manual pick.
    if (parsed.kind || !kindChosenManually) {
      var resolved = inferredKind(parsed.kind, draft.app.isFree, !!trimmedCode());
      if (resolved !== draft.kind) {
        draft.kind = resolved;
        filled.unshift(t()['kind' + resolved.charAt(0).toUpperCase() + resolved.slice(1)]);
      }
      kindChosenManually = false;
    }
    $('autoFill').textContent = filled.length ? t().autoFilled(filled.join(' · ')) : '';
  }

  function loadIcon(src) {
    if (!src) { iconImg = null; return; }
    var img = new Image();
    img.crossOrigin = 'anonymous';   // so the canvas stays exportable
    img.onload = function () { iconImg = img; render(); };
    img.onerror = function () { iconImg = null; render(); };
    img.src = src;
  }

  // =====================================================================
  //  The card — mirrors GiftCardView.swift
  // =====================================================================

  var SANS = '"SF Pro Rounded", "Apple SD Gothic Neo", -apple-system, system-ui, sans-serif';
  var MONO = 'ui-monospace, "SF Mono", Menlo, monospace';

  function st() { return STYLES[draft.style]; }

  /*
   * The fit pass.
   *
   * `fit` holds a per-block multiplier that the layout knows nothing about: the user's
   * own scale says how big they want a block, and this says how big it can actually be
   * without landing on something else. It is recomputed from scratch on every draw and
   * never saved — a card that fits stays exactly as composed.
   *
   * It exists because block sizes come from content, not from the layout. An App Store
   * offer code is eighteen characters, and eighteen characters of monospace is half as
   * wide again as the twelve the placements were first budgeted around; a long message
   * runs to three lines where two were allowed for. Warning about that after the fact
   * is no good when the card has already been sent.
   */
  var fit = {};
  function fitOf(id) { return fit[id] || 1; }

  /** The size a block is actually drawn at: what was asked for, times what fits. */
  function eff(id) { return scaleOf(id) * fitOf(id); }

  /** A font size at the card scale × the style's scale × the block's effective scale. */
  function fs(base, id) {
    var s = st();
    var emphasis = id === 'occasion' ? s.headlineScale : 1;
    return Math.round(base * TYPE_SCALE * s.typeScale * emphasis * eff(id));
  }
  /** Spacing that hangs off the type, so a resized block grows as a piece. */
  function sp(base, id) { return base * eff(id); }

  function roundRect(c, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }

  function tracked(c, text, x, y, spacing) {
    if ('letterSpacing' in c) {
      c.letterSpacing = spacing + 'px';
      c.fillText(text, x, y);
      c.letterSpacing = '0px';
      return;
    }
    var cx = x;
    for (var i = 0; i < text.length; i++) {
      c.fillText(text[i], cx, y);
      cx += c.measureText(text[i]).width + spacing;
    }
  }
  function measureTracked(c, text, spacing) {
    if ('letterSpacing' in c) {
      c.letterSpacing = spacing + 'px';
      var w = c.measureText(text).width;
      c.letterSpacing = '0px';
      return w;
    }
    return c.measureText(text).width + spacing * Math.max(0, text.length - 1);
  }

  /**
   * Wraps to a width, honouring explicit newlines and breaking mid-word when a word
   * doesn't fit. The mid-word break is what makes this work for Korean, which often
   * gives a whole clause with no space in it to break on.
   */
  function wrapText(c, text, maxW, maxLines) {
    var out = [];
    String(text).split('\n').forEach(function (para) {
      var line = '';
      var words = para.split(/(\s+)/);
      words.forEach(function (piece) {
        if (out.length >= maxLines) return;
        var test = line + piece;
        if (c.measureText(test).width <= maxW || !line.trim()) {
          // A single piece wider than the box still has to be broken somewhere.
          if (c.measureText(test).width > maxW && !line.trim()) {
            var buf = '';
            for (var i = 0; i < piece.length; i++) {
              if (c.measureText(buf + piece[i]).width > maxW && buf) {
                out.push(buf);
                if (out.length >= maxLines) return;
                buf = piece[i];
              } else buf += piece[i];
            }
            line = buf;
          } else line = test;
        } else {
          out.push(line.replace(/\s+$/, ''));
          line = piece.replace(/^\s+/, '');
        }
      });
      if (out.length < maxLines && line.trim()) out.push(line.replace(/\s+$/, ''));
    });
    return out.slice(0, maxLines);
  }

  function hexA(hex, a) {
    var v = parseInt(hex.slice(1), 16);
    return 'rgba(' + ((v >> 16) & 255) + ',' + ((v >> 8) & 255) + ',' + (v & 255) + ',' + a + ')';
  }

  /** Everything on the card, measured, so the editor can hit-test what it draws. */
  function buildBlocks(c) {
    var s = st();
    var W = cardText();
    var ink = '#fff';
    var blocks = [];
    var alignCentre = s.centered;

    function push(id, w, h, draw) {
      if (!layout[id]) return;
      blocks.push({ id: id, w: w, h: h, draw: draw,
                    x: layout[id].x * CANVAS.w, y: layout[id].y * CANVAS.h });
    }

    // ---- occasion
    var occText = (draft.occasion.trim() || W.defaultOccasion).toUpperCase();
    var occFont = '700 ' + fs(15, 'occasion') + 'px ' + SANS;
    var occTrack = 4.5 * eff('occasion') * (draft.style === 'poster' ? 0.30 : 1);
    c.font = occFont;
    var occLines = s.headlineMaxWidth
      ? wrapText(c, occText, s.headlineMaxWidth, 2)
      : [occText];
    var occLead = fs(15, 'occasion') * 1.25;
    var occW = 0;
    occLines.forEach(function (l) { occW = Math.max(occW, measureTracked(c, l, occTrack)); });
    push('occasion', occW, occLines.length * occLead, function (g) {
      g.fillStyle = ink; g.globalAlpha = 0.85; g.font = occFont;
      occLines.forEach(function (l, i) {
        var x = alignCentre ? (occW - measureTracked(g, l, occTrack)) / 2 : 0;
        tracked(g, l, x, i * occLead, occTrack);
      });
      g.globalAlpha = 1;
    });

    // ---- badge
    var badgeFont = '600 ' + fs(14, 'badge') + 'px ' + SANS;
    c.font = badgeFont;
    var badgeW = c.measureText(W.badge).width + sp(16, 'badge') * 2;
    var badgeH = fs(14, 'badge') * 1.25 + sp(8, 'badge') * 2;
    push('badge', badgeW, badgeH, function (g) {
      g.strokeStyle = 'rgba(255,255,255,.45)';
      g.lineWidth = 1.2;
      roundRect(g, 0, 0, badgeW, badgeH, badgeH / 2);
      g.stroke();
      g.fillStyle = ink; g.globalAlpha = 0.75; g.font = badgeFont;
      g.fillText(W.badge, sp(16, 'badge'), badgeH / 2 - fs(14, 'badge') * 0.62 + fs(14, 'badge') * 0.15);
      g.globalAlpha = 1;
    });

    // ---- logo
    var side = 152 * eff('logo');
    var radius = 34 * eff('logo');
    push('logo', side, side, function (g) {
      g.save();
      roundRect(g, 0, 0, side, side, radius);
      g.clip();
      if (iconImg) {
        g.drawImage(iconImg, 0, 0, side, side);
      } else {
        g.fillStyle = 'rgba(255,255,255,.22)';
        g.fillRect(0, 0, side, side);
        g.fillStyle = 'rgba(255,255,255,.7)';
        g.font = '700 ' + fs(64, 'logo') + 'px ' + SANS;
        g.textAlign = 'center';
        g.fillText((draft.app ? draft.app.name : '?').trim().charAt(0) || '?',
                   side / 2, side / 2 - fs(64, 'logo') * 0.42);
        g.textAlign = 'left';
      }
      g.restore();
      g.strokeStyle = 'rgba(255,255,255,.3)'; g.lineWidth = 1;
      roundRect(g, 0, 0, side, side, radius);
      g.stroke();
    });

    // ---- title
    var nameFont = '700 ' + fs(44, 'title') + 'px ' + SANS;
    var devFont = '500 ' + fs(20, 'title') + 'px ' + SANS;
    var nameText = draft.app ? draft.app.name : W.placeholderApp;
    var devText = draft.app ? (draft.app.developer || '') : W.placeholderDev;
    var titleBoxW = s.titleMaxWidth * eff('title');
    c.font = nameFont;
    var nameLines = wrapText(c, nameText, titleBoxW, 2);
    var nameLead = fs(44, 'title') * 1.15;
    var titleH = nameLines.length * nameLead + (devText ? sp(8, 'title') + fs(20, 'title') * 1.3 : 0);
    push('title', titleBoxW, titleH, function (g) {
      g.fillStyle = ink; g.font = nameFont;
      nameLines.forEach(function (l, i) {
        var x = alignCentre ? (titleBoxW - g.measureText(l).width) / 2 : 0;
        g.fillText(l, x, i * nameLead);
      });
      if (!devText) return;
      g.font = devFont; g.globalAlpha = 0.78;
      var dx = alignCentre ? (titleBoxW - g.measureText(devText).width) / 2 : 0;
      g.fillText(devText, dx, nameLines.length * nameLead + sp(8, 'title'));
      g.globalAlpha = 1;
    });

    // ---- message
    if (draft.message.trim()) {
      var msgFont = '400 ' + fs(25, 'message') + 'px ' + SANS;
      var msgBoxW = s.messageMaxWidth * eff('message');
      c.font = msgFont;
      var msgLines = wrapText(c, draft.message.trim(), msgBoxW, 3);
      var msgLead = fs(25, 'message') * 1.28 + sp(7, 'message');
      push('message', msgBoxW, msgLines.length * msgLead, function (g) {
        g.fillStyle = ink; g.globalAlpha = 0.95; g.font = msgFont;
        msgLines.forEach(function (l, i) {
          var x = alignCentre ? (msgBoxW - g.measureText(l).width) / 2 : 0;
          g.fillText(l, x, i * msgLead);
        });
        g.globalAlpha = 1;
      });
    }

    // ---- people
    var rows = [];
    if (draft.recipient.trim()) rows.push({ text: W.to(draft.recipient.trim()), size: 19, weight: '600', alpha: 0.9 });
    if (draft.sender.trim()) rows.push({ text: W.from(draft.sender.trim()), size: 17, weight: '500', alpha: 0.78 });
    if (draft.expiry && hasExpiry()) {
      var e = draft.expiry.split('-');
      if (e.length === 3) rows.push({ text: W.validUntil(e[0], +e[1], +e[2]), size: 14, weight: '500', alpha: 0.65, gap: true });
    }
    if (rows.length) {
      var peopleW = 0, peopleH = 0;
      rows.forEach(function (r) {
        c.font = r.weight + ' ' + fs(r.size, 'people') + 'px ' + SANS;
        peopleW = Math.max(peopleW, c.measureText(r.text).width);
        peopleH += fs(r.size, 'people') * 1.3 + sp(6, 'people') + (r.gap ? sp(4, 'people') : 0);
      });
      push('people', peopleW, peopleH, function (g) {
        var y = 0;
        g.fillStyle = ink;
        rows.forEach(function (r) {
          if (r.gap) y += sp(4, 'people');
          g.globalAlpha = r.alpha;
          g.font = r.weight + ' ' + fs(r.size, 'people') + 'px ' + SANS;
          g.fillText(r.text, 0, y);
          y += fs(r.size, 'people') * 1.3 + sp(6, 'people');
        });
        g.globalAlpha = 1;
      });
    }

    // ---- code
    if (draft.showCode && requiresCode() && trimmedCode()) {
      var codeFont = '500 ' + fs(18, 'code') + 'px ' + MONO;
      var codeTrack = sp(2, 'code');
      c.font = codeFont;
      var codeW = measureTracked(c, trimmedCode(), codeTrack) + sp(20, 'code') * 2;
      var codeH = fs(18, 'code') * 1.3 + sp(13, 'code') * 2;
      push('code', codeW, codeH, function (g) {
        g.strokeStyle = 'rgba(255,255,255,.6)';
        g.lineWidth = 1.4;
        g.setLineDash([6, 5]);
        roundRect(g, 0, 0, codeW, codeH, sp(16, 'code'));
        g.stroke();
        g.setLineDash([]);
        g.fillStyle = ink; g.font = codeFont;
        tracked(g, trimmedCode(), sp(20, 'code'), codeH / 2 - fs(18, 'code') * 0.56, codeTrack);
      });
    }

    // ---- qr
    var url = redeemURL();
    if (draft.showQR && url && window.QR) {
      var q = 104 * eff('qr');
      var pad = 9 * eff('qr');
      var box = q + pad * 2;
      push('qr', box, box, function (g) {
        g.fillStyle = '#fff';
        roundRect(g, 0, 0, box, box, 16 * eff('qr'));
        g.fill();
        var m = window.QR.matrix(url, 'M');
        var n = m.length;
        var cell = q / n;
        g.fillStyle = '#000';
        for (var r = 0; r < n; r++) {
          for (var col = 0; col < n; col++) {
            if (m[r][col]) g.fillRect(pad + col * cell, pad + r * cell, Math.ceil(cell), Math.ceil(cell));
          }
        }
      });
    }

    return blocks;
  }

  /**
   * Are two boxes too close? Not bare overlap — a gutter, because a code chip whose
   * border just touches the QR panel reads as a mistake even though strictly nothing
   * is on top of anything. 8 of 1000 card units is about a millimetre in the hand.
   */
  var GUTTER = 8;
  function hits(a, b) {
    return a.x - GUTTER < b.x + b.w && b.x - GUTTER < a.x + a.w &&
           a.y - GUTTER < b.y + b.h && b.y - GUTTER < a.y + a.h;
  }

  /**
   * The block that should give way, or null when the card is already clear.
   *
   * Artwork holds its size — a QR shrunk to fit is a QR that may not scan, and a
   * shrunken icon just looks like a mistake. Between two pieces of text the earlier
   * one yields, because the blocks low and right are the utilities (the code, the
   * dates) that are anchored there on purpose, while the message above them is the
   * part that can afford to be a little smaller.
   */
  function firstConflict(blocks) {
    for (var i = 0; i < blocks.length; i++) {
      var b = blocks[i];
      if (b.x + b.w > CANVAS.w + 1 || b.y + b.h > CANVAS.h + 1) return b.id;
    }
    for (var m = 0; m < blocks.length; m++) {
      for (var n = m + 1; n < blocks.length; n++) {
        var a = blocks[m], c2 = blocks[n];
        if (!hits(a, c2)) continue;
        var aArt = !!ARTWORK[a.id], cArt = !!ARTWORK[c2.id];
        // Preferred yielder first, the other as a fallback: shrinking cannot move a
        // block, so when one starts inside another there is nothing the preferred one
        // can give up. Rather than grind it down to nothing, let the other — even
        // artwork — take a little.
        var order = aArt !== cArt ? (aArt ? [c2, a] : [a, c2])
                  : (a.y !== c2.y ? (a.y < c2.y ? [a, c2] : [c2, a])
                                  : (a.x <= c2.x ? [a, c2] : [c2, a]));
        for (var q = 0; q < order.length; q++) {
          var id = order[q].id;
          if (fitOf(id) - 0.04 >= (ARTWORK[id] ? 0.75 : 0.5)) return id;
        }
      }
    }
    return null;
  }

  /**
   * Measures the card, and shrinks whatever doesn't fit until nothing overlaps.
   *
   * Runs on every draw, so the preview, the PNG and the batch all get the same
   * treatment — a card can't be sent with its code sitting under its QR. Blocks that
   * already fit are left at exactly the size they were composed at.
   */
  function buildFittedBlocks(c) {
    fit = {};
    var blocks = buildBlocks(c);
    for (var pass = 0; pass < 40; pass++) {
      // firstConflict only nominates a block that still has room to give; when nothing
      // does, it returns null and the editor's warning takes over.
      var who = firstConflict(blocks);
      if (!who) break;
      fit[who] = fitOf(who) - 0.04;
      blocks = buildBlocks(c);
    }
    return blocks;
  }

  /**
   * Draws the card alone — no backdrop — at `scale`, and returns the canvas.
   *
   * The preview and the export are this one function at two scales, so what you
   * arrange is what ships. The notches are cut with destination-out afterwards, which
   * leaves real holes: over the preview's backdrop here, and transparent in the PNG.
   */
  function renderCard(scale, blocksOut) {
    var s = st();
    var cv = document.createElement('canvas');
    cv.width = Math.round(CANVAS.w * scale);
    cv.height = Math.round(CANVAS.h * scale);
    var c = cv.getContext('2d');
    c.scale(scale, scale);
    c.textBaseline = 'top';

    var theme = THEMES[draft.theme];

    c.save();
    roundRect(c, 0, 0, CANVAS.w, CANVAS.h, s.cornerRadius);
    c.clip();

    // base gradient, bottom-left to top-right
    var g = c.createLinearGradient(0, CANVAS.h, CANVAS.w, 0);
    g.addColorStop(0, theme.stops[0]);
    g.addColorStop(0.5, theme.stops[1]);
    g.addColorStop(1, theme.stops[2]);
    c.fillStyle = g;
    c.fillRect(0, 0, CANVAS.w, CANVAS.h);

    // the two soft blooms
    [[-40, 85, 500, theme.blooms[0], 0.55], [830, 565, 560, theme.blooms[1], 0.5]]
      .forEach(function (b) {
        var rg = c.createRadialGradient(b[0], b[1], 0, b[0], b[1], b[2]);
        rg.addColorStop(0, hexA(b[3], b[4] * s.bloom));
        rg.addColorStop(1, hexA(b[3], 0));
        c.fillStyle = rg;
        c.fillRect(0, 0, CANVAS.w, CANVAS.h);
      });

    if (s.sheen > 0) {
      var sw = c.createLinearGradient(0, 0, CANVAS.w * 0.62, CANVAS.h * 0.55);
      sw.addColorStop(0, 'rgba(255,255,255,' + s.sheen + ')');
      sw.addColorStop(1, 'rgba(255,255,255,0)');
      c.fillStyle = sw;
      c.fillRect(0, 0, CANVAS.w, CANVAS.h);
    }

    if (s.frame) {
      c.strokeStyle = 'rgba(255,255,255,.32)';
      c.lineWidth = 1.6;
      roundRect(c, 30, 30, CANVAS.w - 60, CANVAS.h - 60, Math.max(4, s.cornerRadius - 22));
      c.stroke();
    }

    if (s.perforation) {
      var px = CANVAS.w * PERFORATION_X;
      c.strokeStyle = 'rgba(255,255,255,.5)';
      c.lineWidth = 2.5;
      c.lineCap = 'round';
      c.setLineDash([9, 11]);
      c.beginPath();
      c.moveTo(px, 26);
      c.lineTo(px, CANVAS.h - 26);
      c.stroke();
      c.setLineDash([]);
      c.lineCap = 'butt';
    }

    var blocks = buildFittedBlocks(c);
    blocks.forEach(function (b) {
      c.save();
      c.translate(b.x, b.y);
      b.draw(c);
      c.restore();
    });
    if (blocksOut) blocks.forEach(function (b) { blocksOut.push(b); });

    c.restore();

    if (s.perforation) {
      var nx = CANVAS.w * PERFORATION_X;
      c.save();
      c.globalCompositeOperation = 'destination-out';
      c.fillStyle = '#000';
      [0, CANVAS.h].forEach(function (y) {
        c.beginPath();
        c.arc(nx, y, 22, 0, Math.PI * 2);
        c.fill();
      });
      c.restore();
    }

    return cv;
  }

  // =====================================================================
  //  Preview and the drag editor
  // =====================================================================

  var CARD_RECT = { x: 0, y: 0, w: 0, h: 0, scale: 1 };
  var hitBlocks = [];
  var editor = { hover: null, sel: null, drag: null, resize: null, guides: [] };
  var HANDLE = 13;

  function render() {
    var cv = $('card');
    var c = cv.getContext('2d');
    var W = cv.width, H = cv.height;
    c.clearRect(0, 0, W, H);

    // A wash of the card's own colours, so it reads as an object on a surface.
    var theme = THEMES[draft.theme];
    var back = c.createLinearGradient(0, 0, W, H);
    back.addColorStop(0, hexA(theme.stops[0], 0.14));
    back.addColorStop(1, hexA(theme.stops[2], 0.20));
    c.fillStyle = '#f0f0f2';
    c.fillRect(0, 0, W, H);
    c.fillStyle = back;
    c.fillRect(0, 0, W, H);

    var scale = Math.min((W - 160) / CANVAS.w, (H - 160) / CANVAS.h);
    var cw = CANVAS.w * scale, ch = CANVAS.h * scale;
    var cx = (W - cw) / 2, cy = (H - ch) / 2;
    CARD_RECT = { x: cx, y: cy, w: cw, h: ch, scale: scale };

    var blocks = [];
    // Draw at device resolution so the preview isn't soft on a retina screen.
    var card = renderCard(scale * (window.devicePixelRatio || 1), blocks);

    c.save();
    c.shadowColor = 'rgba(20,16,40,.30)';
    c.shadowBlur = 60;
    c.shadowOffsetY = 24;
    c.drawImage(card, cx, cy, cw, ch);
    c.restore();

    hitBlocks = blocks.map(function (b) {
      return { id: b.id, rect: { x: cx + b.x * scale, y: cy + b.y * scale,
                                 w: b.w * scale, h: b.h * scale } };
    });

    drawOverlay(c);
    syncLinks();
    // Dragging changes whether there's anything to reset, and only a render knows.
    $('resetLayout').disabled = layoutIsDefault();
    // Here, not at the call sites: the hint reports on `hitBlocks`, which only exists
    // once the card has been drawn. Called before a render it describes the previous
    // card — which is how a collision in one style came to be announced under another.
    updateHint();
  }

  function findBlock(id) {
    for (var i = 0; i < hitBlocks.length; i++) if (hitBlocks[i].id === id) return hitBlocks[i];
    return null;
  }
  function handleRect(b) {
    if (!b) return null;
    var r = b.rect, m = 8;
    return { x: r.x + r.w + m - HANDLE / 2, y: r.y + r.h + m - HANDLE / 2, w: HANDLE, h: HANDLE };
  }
  function hitsHandle(p, b) {
    var h = handleRect(b);
    if (!h) return false;
    var k = 5;
    return p.x >= h.x - k && p.x <= h.x + h.w + k && p.y >= h.y - k && p.y <= h.y + h.h + k;
  }

  /** Pairs of blocks whose boxes run into each other — the export would bake it in. */
  function collisions() {
    var out = [];
    for (var i = 0; i < hitBlocks.length; i++) {
      for (var j = i + 1; j < hitBlocks.length; j++) {
        var a = hitBlocks[i].rect, b = hitBlocks[j].rect, k = 3 * CARD_RECT.scale;
        if (a.x + k < b.x + b.w - k && b.x + k < a.x + a.w - k &&
            a.y + k < b.y + b.h - k && b.y + k < a.y + a.h - k) {
          out.push([hitBlocks[i].id, hitBlocks[j].id]);
        }
      }
    }
    return out;
  }

  function drawOverlay(c) {
    editor.guides.forEach(function (g) {
      c.save();
      c.strokeStyle = 'rgba(0,113,227,.85)';
      c.lineWidth = 1;
      c.setLineDash([6, 4]);
      c.beginPath();
      if (g.axis === 'x') { c.moveTo(g.at, CARD_RECT.y - 14); c.lineTo(g.at, CARD_RECT.y + CARD_RECT.h + 14); }
      else { c.moveTo(CARD_RECT.x - 14, g.at); c.lineTo(CARD_RECT.x + CARD_RECT.w + 14, g.at); }
      c.stroke();
      c.restore();
    });

    var hit = {};
    collisions().forEach(function (pair) { hit[pair[0]] = 1; hit[pair[1]] = 1; });
    Object.keys(hit).forEach(function (id) {
      var b = findBlock(id);
      if (!b) return;
      c.save();
      c.strokeStyle = 'rgba(255,149,0,.95)';
      c.fillStyle = 'rgba(255,149,0,.14)';
      c.lineWidth = 2;
      c.setLineDash([4, 3]);
      roundRect(c, b.rect.x - 8, b.rect.y - 8, b.rect.w + 16, b.rect.h + 16, 9);
      c.fill();
      c.stroke();
      c.restore();
    });

    [[editor.hover, false], [editor.sel, true]].forEach(function (pair) {
      var b = pair[0] && findBlock(pair[0]);
      if (!b) return;
      var strong = pair[1], r = b.rect, m = 8;
      c.save();
      c.strokeStyle = strong ? 'rgba(0,113,227,1)' : 'rgba(0,113,227,.5)';
      c.lineWidth = strong ? 2 : 1.5;
      if (!strong) c.setLineDash([6, 4]);
      roundRect(c, r.x - m, r.y - m, r.w + m * 2, r.h + m * 2, 10);
      c.stroke();
      if (strong) {
        var grip = handleRect(b);
        c.fillStyle = '#fff';
        c.strokeStyle = 'rgba(0,113,227,1)';
        c.lineWidth = 2;
        roundRect(c, grip.x, grip.y, grip.w, grip.h, 3);
        c.fill(); c.stroke();

        var label = (t().blocks[b.id] || b.id) + '  ' + Math.round(scaleOf(b.id) * 100) + '%';
        c.font = '600 15px ' + SANS;
        var tw = c.measureText(label).width;
        var lx = r.x - m, ly = r.y - m - 24;
        if (ly < 4) ly = r.y + r.h + m + 4;
        c.fillStyle = 'rgba(0,113,227,1)';
        roundRect(c, lx, ly, tw + 18, 22, 7);
        c.fill();
        c.fillStyle = '#fff';
        c.textBaseline = 'top';
        c.fillText(label, lx + 9, ly + 3);
      }
      c.restore();
    });
  }

  function toCanvasPoint(e) {
    var cv = $('card'), r = cv.getBoundingClientRect();
    if (!r.width || !r.height) return null;
    return { x: (e.clientX - r.left) * cv.width / r.width,
             y: (e.clientY - r.top) * cv.height / r.height };
  }
  function blockAt(p) {
    for (var i = hitBlocks.length - 1; i >= 0; i--) {
      var r = hitBlocks[i].rect;
      if (p.x >= r.x - 6 && p.x <= r.x + r.w + 6 && p.y >= r.y - 6 && p.y <= r.y + r.h + 6) return hitBlocks[i];
    }
    return null;
  }

  /** Snap to the padding lines, the card centre, and the other blocks' edges. */
  function snapTo(id, x, y, w, h) {
    var TH = 7, s = CARD_RECT.scale;
    var xs = [PADDING * s, CARD_RECT.w - PADDING * s - w, (CARD_RECT.w - w) / 2];
    var ys = [PADDING * s, CARD_RECT.h - PADDING * s - h, (CARD_RECT.h - h) / 2];
    hitBlocks.forEach(function (b) {
      if (b.id === id) return;
      var bx = b.rect.x - CARD_RECT.x, by = b.rect.y - CARD_RECT.y;
      xs.push(bx, bx + b.rect.w - w);
      ys.push(by, by + b.rect.h - h);
    });
    var guides = [];
    function nearest(v, targets) {
      var best = null;
      targets.forEach(function (tv) {
        var d = Math.abs(v - tv);
        if (d < TH && (!best || d < best.d)) best = { d: d, v: tv };
      });
      return best;
    }
    var hx = nearest(x, xs);
    if (hx) { x = hx.v; guides.push({ axis: 'x', at: CARD_RECT.x + x }); }
    var hy = nearest(y, ys);
    if (hy) { y = hy.v; guides.push({ axis: 'y', at: CARD_RECT.y + y }); }
    editor.guides = guides;
    return { x: x, y: y };
  }

  function moveBlock(id, x, y, w, h, withSnap) {
    x = clamp(x, 0, CARD_RECT.w - w);
    y = clamp(y, 0, CARD_RECT.h - h);
    if (withSnap) {
      var sn = snapTo(id, x, y, w, h);
      x = clamp(sn.x, 0, CARD_RECT.w - w);
      y = clamp(sn.y, 0, CARD_RECT.h - h);
    } else editor.guides = [];
    // Write the fields rather than replacing the entry, or a nudge would drop the scale.
    layout[id].x = x / CARD_RECT.w;
    layout[id].y = y / CARD_RECT.h;
  }

  function keepInside(id) {
    var b = findBlock(id);
    if (!b) return false;
    var x = b.rect.x - CARD_RECT.x, y = b.rect.y - CARD_RECT.y;
    var nx = clamp(x, 0, Math.max(0, CARD_RECT.w - b.rect.w));
    var ny = clamp(y, 0, Math.max(0, CARD_RECT.h - b.rect.h));
    if (Math.abs(nx - x) < 1e-6 && Math.abs(ny - y) < 1e-6) return false;
    layout[id].x = nx / CARD_RECT.w;
    layout[id].y = ny / CARD_RECT.h;
    return true;
  }

  function updateHint() {
    var hint = $('editorHint');
    var pairs = collisions();
    if (pairs.length) {
      hint.textContent = t().collide(t().blocks[pairs[0][0]] || pairs[0][0],
                                     t().blocks[pairs[0][1]] || pairs[0][1]);
      hint.className = 'sub warn';
      return;
    }
    hint.className = 'sub';
    if (editor.sel) hint.textContent = t().editorSelected(t().blocks[editor.sel] || editor.sel);
    else if (!layoutIsDefault()) hint.textContent = t().editorChanged;
    else hint.textContent = t().editorIdle;
  }

  function bindEditor() {
    var cv = $('card');

    cv.addEventListener('pointerdown', function (e) {
      var p = toCanvasPoint(e);
      if (!p) return;
      var sel = editor.sel && findBlock(editor.sel);
      if (sel && hitsHandle(p, sel)) {
        editor.resize = { id: sel.id, baseW: sel.rect.w / eff(sel.id), ox: sel.rect.x };
        try { cv.setPointerCapture(e.pointerId); } catch (err) {}
        e.preventDefault();
        return;
      }
      var hit = blockAt(p);
      editor.sel = hit ? hit.id : null;
      if (hit) {
        editor.drag = { id: hit.id, w: hit.rect.w, h: hit.rect.h,
                        dx: p.x - hit.rect.x, dy: p.y - hit.rect.y };
        try { cv.setPointerCapture(e.pointerId); } catch (err) {}
        e.preventDefault();
      }
      cv.focus();
      render();
    });

    cv.addEventListener('pointermove', function (e) {
      var p = toCanvasPoint(e);
      if (!p) return;
      if (editor.resize) {
        var z = editor.resize;
        var want = (p.x - z.ox) / z.baseW;
        if (!e.altKey) want = Math.round(want * 20) / 20;   // 5% steps, Alt to go free
        layout[z.id].s = clamp(want, SCALE_MIN, SCALE_MAX);
        render();
        if (keepInside(z.id)) render();
        return;
      }
      if (editor.drag) {
        var d = editor.drag;
        moveBlock(d.id, p.x - d.dx - CARD_RECT.x, p.y - d.dy - CARD_RECT.y, d.w, d.h, !e.altKey);
        render();
        return;
      }
      var selected = editor.sel && findBlock(editor.sel);
      if (selected && hitsHandle(p, selected)) {
        cv.style.cursor = 'nwse-resize';
        if (editor.hover !== selected.id) { editor.hover = selected.id; render(); }
        return;
      }
      var hit = blockAt(p);
      var id = hit ? hit.id : null;
      cv.style.cursor = id ? 'move' : 'default';
      if (id !== editor.hover) { editor.hover = id; render(); }
    });

    cv.addEventListener('pointerleave', function () {
      if (editor.drag) return;
      if (editor.hover) { editor.hover = null; render(); }
    });

    function endDrag() {
      if (!editor.drag && !editor.resize) return;
      editor.drag = null; editor.resize = null; editor.guides = [];
      saveLayout();
      render();
    }
    cv.addEventListener('pointerup', endDrag);
    cv.addEventListener('pointercancel', endDrag);

    cv.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { editor.sel = null; render(); return; }
      var ZOOM = { '+': 1, '=': 1, '-': -1, '_': -1 };
      if (editor.sel && ZOOM[e.key]) {
        e.preventDefault();
        layout[editor.sel].s = clamp(scaleOf(editor.sel) + ZOOM[e.key] * (e.shiftKey ? 0.2 : 0.05),
                                     SCALE_MIN, SCALE_MAX);
        render();
        if (keepInside(editor.sel)) render();
        saveLayout();
        return;
      }
      var STEPS = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
      var step = STEPS[e.key];
      if (!step || !editor.sel) return;
      var b = findBlock(editor.sel);
      if (!b) return;
      e.preventDefault();
      var n = (e.shiftKey ? 10 : 1) * CARD_RECT.scale;
      moveBlock(editor.sel, b.rect.x - CARD_RECT.x + step[0] * n,
                b.rect.y - CARD_RECT.y + step[1] * n, b.rect.w, b.rect.h, false);
      saveLayout();
      render();
    });
  }

  /** Renders without the selection chrome, so exports never bake in the editor UI. */
  function exportPNG(scale, cb) {
    renderCard(scale || 3).toBlob(cb);
  }

  /**
   * A filesystem-safe stem for an export.
   *
   * `\p{L}` rather than `A-Za-z`, so a Korean app name survives instead of being
   * reduced to the digits in it — which is what Swift's CharacterSet.alphanumerics
   * does on the app side, and the two should agree.
   */
  function fileStem() {
    var app = (draft.app && draft.app.name) || 'gift';
    var who = draft.recipient.trim() || trimmedCode();
    var raw = who ? app + '-' + who : app;
    return raw.replace(/[^\p{L}\p{N}\-_]+/gu, '-')
              .replace(/-+/g, '-')
              .replace(/^-|-$/g, '')
              .toLowerCase() || 'gift';
  }

  function download(blob, name) {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  }

  function flash(msg) {
    $('status').textContent = msg;
    clearTimeout(flash.timer);
    flash.timer = setTimeout(function () { $('status').textContent = ''; }, 3600);
  }

  // =====================================================================
  //  Form wiring
  // =====================================================================

  function syncLinks() {
    var url = redeemURL();
    $('linkLine').hidden = !url;
    $('redeemLink').textContent = url;
    var ready = isReady();
    ['copyGift', 'copyRedeem', 'copyMessage', 'copyImage', 'savePNG', 'previewGift', 'addLedger']
      .forEach(function (id) { $(id).disabled = !ready; });
  }

  /** Pushes the model back into the controls — used after a lookup and on language change. */
  function syncForm() {
    $('query').value = $('query').value;
    [].forEach.call($('kindSeg').children, function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.kind === draft.kind));
    });
    $('kindWhy').textContent = t()['kind' + draft.kind.charAt(0).toUpperCase() + draft.kind.slice(1) + 'Why'];
    $('codeArea').hidden = !requiresCode();
    $('code').value = draft.code;
    $('codeUsed').hidden = !(requiresCode() && codeAlreadySent(draft.code));
    $('codeUsed').textContent = t().codeAlreadySent;
    $('showCode').disabled = !requiresCode();

    [].forEach.call($('cardLangSeg').children, function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.lang === draft.cardLang));
    });
    [].forEach.call($('stylePicker').children, function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.style === draft.style));
    });
    [].forEach.call($('themePicker').children, function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.theme === draft.theme));
    });
    $('occasion').placeholder = cardText().defaultOccasion;
    $('resetLayout').disabled = layoutIsDefault();
  }

  function buildStylePicker() {
    var host = $('stylePicker');
    host.innerHTML = '';
    STYLE_IDS.forEach(function (id) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'pick';
      b.dataset.style = id;
      b.setAttribute('aria-pressed', String(id === draft.style));

      var thumb = document.createElement('span');
      thumb.className = 'thumb';
      var theme = THEMES[draft.theme];
      thumb.style.background = 'linear-gradient(38deg,' + theme.stops.join(',') + ')';
      if (id === 'minimal') thumb.style.opacity = '.8';
      (THUMBS[id] || []).forEach(function (m) {
        var bar = document.createElement('span');
        bar.className = 'mark' + (m[4] ? ' strong' : '');
        bar.style.left = (m[0] * 100) + '%';
        bar.style.top = (m[1] * 100) + '%';
        bar.style.width = (m[2] * 100) + '%';
        bar.style.height = (m[3] * 100) + '%';
        bar.style.borderRadius = m[4] ? '2.5px' : '1px';
        thumb.appendChild(bar);
      });
      if (STYLES[id].perforation) {
        var perf = document.createElement('span');
        perf.className = 'perf';
        perf.style.left = (PERFORATION_X * 100) + '%';
        perf.style.top = '13%';
        perf.style.height = '74%';
        thumb.appendChild(perf);
      }
      var name = document.createElement('span');
      name.className = 'name';
      name.textContent = t()['style' + id.charAt(0).toUpperCase() + id.slice(1)];

      b.appendChild(thumb);
      b.appendChild(name);
      b.addEventListener('click', function () {
        if (draft.style === id) return;
        saveLayout();                       // keep what was arranged in the old style
        draft.style = id;
        setPref('giftwrap.style', id);
        layout = loadLayout(id);
        editor.sel = null;
        buildStylePicker();
        syncForm();
        render();
      });
      host.appendChild(b);
    });
  }

  function buildThemePicker() {
    var host = $('themePicker');
    host.innerHTML = '';
    THEME_IDS.forEach(function (id) {
      var b = document.createElement('button');
      b.type = 'button';
      b.dataset.theme = id;
      b.setAttribute('aria-pressed', String(id === draft.theme));
      b.title = id;
      b.style.background = 'linear-gradient(38deg,' + THEMES[id].stops.join(',') + ')';
      b.addEventListener('click', function () {
        draft.theme = id;
        setPref('giftwrap.theme', id);
        buildStylePicker();               // the thumbnails wear the theme too
        syncForm();
        render();
      });
      host.appendChild(b);
    });
  }

  function bindForm() {
    $('lookupBtn').addEventListener('click', lookup);
    $('query').addEventListener('keydown', function (e) { if (e.key === 'Enter') lookup(); });
    $('storefront').addEventListener('change', function () { if (draft.app) lookup(); });

    [].forEach.call($('kindSeg').children, function (b) {
      b.addEventListener('click', function () {
        if (draft.kind === b.dataset.kind) return;
        draft.kind = b.dataset.kind;
        kindChosenManually = true;
        $('autoFill').textContent = '';
        syncForm();
        render();
      });
    });

    [].forEach.call($('cardLangSeg').children, function (b) {
      b.addEventListener('click', function () {
        if (draft.cardLang === b.dataset.lang) return;
        draft.cardLang = b.dataset.lang;
        setPref('giftwrap.cardLang', draft.cardLang);   // the default for later cards
        syncForm();
        render();
      });
    });

    var text = {
      code: 'code', occasion: 'occasion', recipient: 'recipient',
      sender: 'sender', message: 'message', pt: 'pt', ct: 'ct'
    };
    Object.keys(text).forEach(function (id) {
      $(id).addEventListener('input', function () {
        draft[text[id]] = this.value;
        if (id === 'code') {
          $('codeUsed').hidden = !codeAlreadySent(this.value);
        }
        render();
      });
    });

    $('hasExpiry').addEventListener('change', function () {
      $('expiryField').hidden = !this.checked;
      if (this.checked && !$('expiry').value) {
        var d = new Date();
        d.setDate(d.getDate() + 28);
        $('expiry').value = d.toISOString().slice(0, 10);
      }
      draft.expiry = this.checked ? $('expiry').value : '';
      render();
    });
    $('expiry').addEventListener('change', function () {
      draft.expiry = $('hasExpiry').checked ? this.value : '';
      render();
    });

    $('showCode').addEventListener('change', function () { draft.showCode = this.checked; render(); });
    $('showQR').addEventListener('change', function () { draft.showQR = this.checked; render(); });

    $('resetLayout').addEventListener('click', function () {
      layout = defaultLayout(draft.style);
      saveLayout();
      editor.sel = null;
      syncForm();
      render();
      flash(t().layoutReset);
    });

    $('openRedeem').addEventListener('click', function () {
      var u = redeemURL();
      if (u) window.open(u, '_blank', 'noopener');
    });
    $('previewGift').addEventListener('click', function () {
      var u = giftLink();
      if (u) window.open(u, '_blank', 'noopener');
    });

    $('copyGift').addEventListener('click', function () {
      copy(giftLink(), t().copiedGiftLink);
    });
    $('copyRedeem').addEventListener('click', function () {
      copy(redeemURL(), t().copiedRedeemLink);
    });
    $('copyMessage').addEventListener('click', function () {
      copy(messageText(), t().copiedMessage);
    });

    $('copyImage').addEventListener('click', function () {
      if (!window.ClipboardItem) { flash(t().noImageCopy); return; }
      exportPNG(3, function (blob) {
        navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })])
          .then(function () { flash(t().copiedImage); })
          .catch(function () { flash(t().noImageCopy); });
      });
    });

    $('savePNG').addEventListener('click', function () {
      exportPNG(3, function (blob) {
        var name = fileStem() + '.png';
        download(blob, name);
        flash(t().saved(name));
      });
    });

    $('addLedger').addEventListener('click', function () {
      if (!isReady()) return;
      recordGift(trimmedCode(), draft.recipient.trim());
      flash(t().recorded);
      renderLedger();
    });
  }

  /**
   * Copies text, with a fallback for where the async clipboard isn't allowed.
   *
   * `navigator.clipboard` needs a secure context, and a file:// page isn't one — which
   * is exactly how someone is most likely to open this, by double-clicking the file.
   * The old execCommand path still works there, so it's worth keeping around.
   */
  function copy(text, okMessage) {
    if (!text) return;
    var fallback = function () {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
      document.body.appendChild(ta);
      ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta);
      flash(ok ? okMessage : t().copyFailed);
    };
    if (!navigator.clipboard || !navigator.clipboard.writeText) { fallback(); return; }
    navigator.clipboard.writeText(text).then(function () { flash(okMessage); }, fallback);
  }

  function recordGift(code, who) {
    ledger.unshift({
      id: String(Date.now()) + Math.round(Math.random() * 1e6),
      issuedAt: new Date().toISOString(),
      appName: draft.app ? draft.app.name : '',
      appleID: draft.app ? draft.app.id : '',
      kind: draft.kind,
      code: code || '',
      recipient: who || '',
      link: giftLink() || redeemURL(),
      expiry: draft.expiry || '',
      redeemed: false
    });
    saveLedger();
  }

  // =====================================================================
  //  Batch
  // =====================================================================

  function batchEntries() {
    return $('batchInput').value.split('\n').map(function (line) {
      var parts = line.split(',');
      var code = (parts[0] || '').trim().toUpperCase();
      if (!code) return null;
      return { code: code, recipient: (parts[1] || '').trim() };
    }).filter(Boolean);
  }

  /**
   * Reads the CSV App Store Connect hands you for one-time offer codes.
   *
   * The file has no header — the first line is already a code — and two columns:
   * the code, and a redeem URL carrying `ctx`, the Apple ID and the code again. Both
   * are read, because either one on its own is enough to place a code, and the URL is
   * what tells us which app this batch is even for.
   *
   * Deliberately forgiving: a file exported with only the codes, or one pasted with
   * quoting and trailing punctuation, still lands.
   */
  function parseCodeCSV(text) {
    var out = [], seen = {};
    text.split(/\r?\n/).forEach(function (line) {
      line = line.trim();
      if (!line) return;
      var url = (line.match(/https?:\/\/\S*apps\.apple\.com\/\S*/i) || [])[0];
      if (url) url = url.replace(/[",;]+$/, '');
      var code = null, id = '', ctx = '';
      if (url) {
        code = (url.match(/[?&]code=([^&\s]+)/i) || [])[1] || null;
        id = (url.match(/[?&]id=(\d+)/i) || [])[1] || '';
        ctx = ((url.match(/[?&]ctx=(offercodes|apps)\b/i) || [])[1] || '').toLowerCase();
      }
      if (!code) {
        var first = line.split(',')[0].trim().replace(/^"|"$/g, '');
        if (/^[A-Z0-9]{8,24}$/i.test(first)) code = first;
      }
      if (!code) return;
      code = decodeURIComponent(code).toUpperCase();
      if (seen[code]) return;
      seen[code] = true;
      out.push({ code: code, id: id, ctx: ctx });
    });
    return out;
  }

  /** Takes a parsed file and sets up the whole batch from it. */
  function ingestCodes(text, label) {
    var parsed = parseCodeCSV(text);
    if (!parsed.length) { $('batchStatus').textContent = t().csvNoCodes; return; }

    $('batchInput').value = parsed.map(function (e) { return e.code; }).join('\n');

    // The file says which kind of code these are, and it is the only thing here that
    // actually knows. Marked as a deliberate choice so the lookup that follows doesn't
    // infer its way back to a plain download link from an app that happens to be free.
    var withCtx = parsed.find(function (e) { return e.ctx; });
    if (withCtx) {
      draft.kind = withCtx.ctx === 'apps' ? 'appPromoCode' : 'offerCode';
      kindChosenManually = true;
      syncForm();
    }

    // And which app they belong to, so the batch doesn't need a separate lookup.
    var withID = parsed.find(function (e) { return e.id; });
    var lines = text.split(/\r?\n/).filter(function (l) { return l.trim(); }).length;
    var dropped = lines - parsed.length;
    $('batchStatus').textContent = t().csvLoaded(label, parsed.length, dropped);

    if (withID && (!draft.app || String(draft.app.id) !== withID.id)) {
      $('query').value = withID.id;
      lookup();
    }
    renderBatchPreview();
  }

  /** Runs `fn` with the draft temporarily set to one batch entry, then puts it back. */
  function withEntry(entry, fn) {
    var keepCode = draft.code, keepWho = draft.recipient;
    draft.code = entry.code;
    if (entry.recipient) draft.recipient = entry.recipient;
    try { return fn(); }
    finally { draft.code = keepCode; draft.recipient = keepWho; }
  }

  function renderBatchPreview() {
    var cv = $('batchCard');
    var c = cv.getContext('2d');
    c.clearRect(0, 0, cv.width, cv.height);
    var entries = batchEntries();
    $('batchCount').textContent = t().batchRecognised(entries.length);

    var draw = function () {
      var scale = Math.min((cv.width - 160) / CANVAS.w, (cv.height - 160) / CANVAS.h);
      var cw = CANVAS.w * scale, ch = CANVAS.h * scale;
      var card = renderCard(scale * (window.devicePixelRatio || 1));
      c.fillStyle = '#f0f0f2';
      c.fillRect(0, 0, cv.width, cv.height);
      c.save();
      c.shadowColor = 'rgba(20,16,40,.30)';
      c.shadowBlur = 60;
      c.shadowOffsetY = 24;
      c.drawImage(card, (cv.width - cw) / 2, (cv.height - ch) / 2, cw, ch);
      c.restore();
    };
    if (entries.length) withEntry(entries[0], draw); else draw();
  }

  function batchRows() {
    return batchEntries().map(function (e) {
      return withEntry(e, function () {
        return { code: e.code, recipient: e.recipient, gift: giftLink(), redeem: redeemURL() };
      });
    });
  }

  function bindBatch() {
    $('batchInput').addEventListener('input', renderBatchPreview);

    var drop = $('csvDrop');
    drop.addEventListener('click', function () { $('csvFile').click(); });
    ['dragenter', 'dragover'].forEach(function (e) {
      drop.addEventListener(e, function (ev) { ev.preventDefault(); drop.classList.add('over'); });
    });
    ['dragleave', 'drop'].forEach(function (e) {
      drop.addEventListener(e, function (ev) { ev.preventDefault(); drop.classList.remove('over'); });
    });
    drop.addEventListener('drop', function (ev) {
      var f = ev.dataTransfer.files[0];
      if (f) f.text().then(function (text) { ingestCodes(text, f.name); });
    });
    $('csvFile').addEventListener('change', function () {
      var f = this.files[0];
      if (f) f.text().then(function (text) { ingestCodes(text, f.name); });
    });

    $('batchCSV').addEventListener('click', function () {
      if (!isReadyForBatch()) return;
      var rows = [['code', 'recipient', 'gift_link', 'redeem_link']];
      batchRows().forEach(function (r) { rows.push([r.code, r.recipient, r.gift, r.redeem]); });
      var csv = rows.map(function (r) {
        return r.map(function (v) { return '"' + String(v).replace(/"/g, '""') + '"'; }).join(',');
      }).join('\n');
      download(new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' }), 'giftwrap-batch.csv');

      var entries = batchEntries();
      entries.forEach(function (e) { withEntry(e, function () { recordGift(e.code, e.recipient); }); });
      renderLedger();
      $('batchStatus').textContent = t().batchAdded(entries.length);
    });

    $('batchPNG').addEventListener('click', function () {
      if (!isReadyForBatch()) return;
      var entries = batchEntries();
      // A file of offer codes runs to hundreds, and each card is a separate download.
      // Worth asking before the browser starts a five-hundred-file prompt storm.
      if (entries.length > 40 && !confirm(t().confirmManyPNG(entries.length))) return;
      var i = 0;
      (function next() {
        if (i >= entries.length) { $('batchStatus').textContent = t().batchDone(entries.length); return; }
        var e = entries[i++];
        $('batchStatus').textContent = t().batchDownloading(i, entries.length);
        withEntry(e, function () {
          var name = fileStem() + '.png';
          exportPNG(3, function (blob) {
            download(blob, name);
            setTimeout(next, 260);   // browsers throttle back-to-back downloads
          });
        });
      })();
    });
  }

  function isReadyForBatch() {
    if (!draft.app) { $('batchStatus').textContent = t().needApp; return false; }
    if (!batchEntries().length) { $('batchStatus').textContent = t().needCode; return false; }
    return true;
  }

  // =====================================================================
  //  Ledger
  // =====================================================================

  function renderLedger() {
    var body = $('ledgerBody');
    body.innerHTML = '';
    var q = $('ledgerSearch').value.trim().toLowerCase();
    var shown = ledger.filter(function (r) {
      if (!q) return true;
      return (r.appName + ' ' + r.recipient + ' ' + r.code).toLowerCase().indexOf(q) >= 0;
    });

    $('ledgerCount').textContent = t().ledgerCount(ledger.length);
    $('ledgerEmpty').textContent = ledger.length ? '' : t().ledgerEmpty;
    $('ledgerCSV').disabled = !ledger.length;
    $('ledgerClear').disabled = !ledger.length;

    shown.forEach(function (r) {
      var tr = document.createElement('tr');
      if (r.redeemed) tr.className = 'done';

      function cell(text, cls) {
        var td = document.createElement('td');
        if (cls) td.className = cls;
        td.textContent = text;
        tr.appendChild(td);
        return td;
      }
      cell((r.issuedAt || '').slice(0, 10));
      cell(r.appName || '—');
      cell(r.recipient || '—');
      cell(r.code || '—', 'code');
      cell(t()['kind' + r.kind.charAt(0).toUpperCase() + r.kind.slice(1)] || r.kind);

      var tdDone = document.createElement('td');
      var box = document.createElement('input');
      box.type = 'checkbox';
      box.checked = !!r.redeemed;
      box.addEventListener('change', function () {
        r.redeemed = box.checked;
        saveLedger();
        renderLedger();
      });
      tdDone.appendChild(box);
      tr.appendChild(tdDone);

      var tdAct = document.createElement('td');
      var link = document.createElement('button');
      link.className = 'mini';
      link.textContent = t().copyLink;
      link.addEventListener('click', function () { copy(r.link, t().copiedGiftLink); });
      tdAct.appendChild(link);
      tr.appendChild(tdAct);

      body.appendChild(tr);
    });
  }

  function bindLedger() {
    $('ledgerSearch').addEventListener('input', renderLedger);
    $('ledgerCSV').addEventListener('click', function () {
      var rows = [['issued_at', 'app', 'apple_id', 'kind', 'code', 'recipient', 'link', 'expiry', 'redeemed']];
      ledger.forEach(function (r) {
        rows.push([r.issuedAt, r.appName, r.appleID, r.kind, r.code,
                   r.recipient, r.link, r.expiry, r.redeemed ? 'yes' : 'no']);
      });
      var csv = rows.map(function (r) {
        return r.map(function (v) { return '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"'; }).join(',');
      }).join('\n');
      download(new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' }), 'giftwrap-ledger.csv');
    });
    $('ledgerClear').addEventListener('click', function () {
      if (!confirm(t().confirmClear)) return;
      ledger = [];
      saveLedger();
      renderLedger();
    });
  }

  // =====================================================================
  //  Language and tabs
  // =====================================================================

  function applyUILanguage() {
    document.documentElement.lang = LANG;
    var attrs = [
      ['data-i18n', function (el, v) { el.textContent = v; }],
      ['data-i18n-html', function (el, v) { el.innerHTML = v; }],
      ['data-i18n-ph', function (el, v) { el.placeholder = v; }],
      ['data-i18n-aria', function (el, v) { el.setAttribute('aria-label', v); }]
    ];
    attrs.forEach(function (pair) {
      document.querySelectorAll('[' + pair[0] + ']').forEach(function (node) {
        var v = t()[node.getAttribute(pair[0])];
        if (v !== undefined) pair[1](node, v);
      });
    });
    [].forEach.call($('uiLang').children, function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.lang === LANG));
    });
    buildStylePicker();
    syncForm();
    renderLedger();
    renderBatchPreview();
    render();
  }

  function bindChrome() {
    [].forEach.call($('uiLang').children, function (b) {
      b.addEventListener('click', function () {
        if (b.dataset.lang === LANG) return;
        LANG = b.dataset.lang;
        setPref('giftwrap.uiLang', LANG);
        applyUILanguage();
      });
    });

    document.querySelectorAll('.tabs button').forEach(function (btn) {
      btn.addEventListener('click', function () {
        document.querySelectorAll('.tabs button').forEach(function (b) {
          b.setAttribute('aria-selected', String(b === btn));
        });
        ['compose', 'batch', 'ledger'].forEach(function (name) {
          $('tab-' + name).hidden = name !== btn.dataset.tab;
        });
        if (btn.dataset.tab === 'ledger') renderLedger();
        if (btn.dataset.tab === 'batch') renderBatchPreview();
        if (btn.dataset.tab === 'compose') render();
      });
    });
  }

  // ---------- boot ----------
  buildThemePicker();
  buildStylePicker();
  bindEditor();
  bindForm();
  bindBatch();
  bindLedger();
  bindChrome();
  applyUILanguage();
})();
</script>
</body>
</html>
